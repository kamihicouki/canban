<text x="666" y="658" font-size="18" fill="#235F4F" font-weight="600">操作の調整</text>
<text x="96" y="791" font-size="18" fill="#527087" font-weight="400">輪の大きさ = 未達 + 未観測。線 = 同じ基準の中の確認済み履歴。</text>
<rect x="953" y="250" width="580" height="162" rx="22" fill="white" fill-opacity=".75"/>
<text x="980" y="286" font-size="21" fill="#2B65C7" font-weight="700">01</text>
<text x="1035" y="288" font-size="27" fill="#19324D" font-weight="700">目標と完了の条件を書く</text>
<text x="1035" y="333" font-size="21" fill="#527087" font-weight="400">「何を満たせば終えるか」を共有。</text>
<text x="1035" y="366" font-size="21" fill="#527087" font-weight="400">大きな周期に、小さな修正を紐付ける。</text>
<rect x="953" y="437" width="580" height="162" rx="22" fill="white" fill-opacity=".75"/>
<text x="980" y="473" font-size="21" fill="#2B65C7" font-weight="700">02</text>
<text x="1035" y="475" font-size="27" fill="#19324D" font-weight="700">根拠を確認した分だけ近づく</text>
<text x="1035" y="520" font-size="21" fill="#527087" font-weight="400">未観測・未確認は、距離として残る。</text>
<text x="1035" y="553" font-size="21" fill="#527087" font-weight="400">成果物が変わったら、もう一度確かめる。</text>
<rect x="953" y="624" width="580" height="162" rx="22" fill="white" fill-opacity=".75"/>
<text x="980" y="660" font-size="21" fill="#2B65C7" font-weight="700">03</text>
<text x="1035" y="662" font-size="27" fill="#19324D" font-weight="700">次の調整に、学びを渡す</text>
<text x="1035" y="707" font-size="21" fill="#527087" font-weight="400">前の観測から、1周分の指示を作る。</text>
<text x="1035" y="740" font-size="21" fill="#527087" font-weight="400">送信は手動。周回の上限で止まる。</text>
<rect x="64" y="853" width="1469" height="90" rx="24" fill="#163554"/>
<text x="102" y="908" font-size="18" fill="#8DB5ED" font-weight="600">01</text>
<text x="150" y="908" font-size="25" fill="white" font-weight="600">条件を書く</text>
<text x="382" y="908" font-size="25" fill="#8DB5ED" font-weight="400">→</text>
<text x="447" y="908" font-size="18" fill="#8DB5ED" font-weight="600">02</text>
<text x="495" y="908" font-size="25" fill="white" font-weight="600">調整する</text>
<text x="727" y="908" font-size="25" fill="#8DB5ED" font-weight="400">→</text>
<text x="792" y="908" font-size="18" fill="#8DB5ED" font-weight="600">03</text>
<text x="840" y="908" font-size="25" fill="white" font-weight="600">根拠を残す</text>
<text x="1072" y="908" font-size="25" fill="#8DB5ED" font-weight="400">→</text>
<text x="1137" y="908" font-size="18" fill="#8DB5ED" font-weight="600">04</text>
<text x="1185" y="908" font-size="25" fill="white" font-weight="600">人が確認する</text>
<text x="74" y="978" font-size="16" fill="#527087" font-weight="400">紹介用の概念図 · 0.27.0 作業ブランチの実装 · 自動反復は行わず、確認を1周ずつ残します。</text>
