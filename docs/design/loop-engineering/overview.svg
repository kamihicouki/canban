<title id="title">Canban 改善ループと軌道ビュー</title><desc id="desc">中心に目標、大きな周期に小さな修正。根拠を確認した条件だけ輪が縮む。条件を書く、調整する、根拠を残す、人が確認する、の4段階で1周する手動補助の機能。</desc>
