<text x="1480" y="73" font-size="19" fill="#527087" font-weight="500">0.27.0</text>
<text x="72" y="147" font-size="52" fill="#102B47" font-weight="700">大きな流れの中で、小さく確かめる。</text>
<text x="75" y="190" font-size="25" fill="#527087" font-weight="400">目標を中心に、根拠のある周回を重ねる。</text>
