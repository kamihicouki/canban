name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 --version
      # Keep timing-sensitive DB tests independent from other test-file workers.
      # sqlite.test.mjs still exercises ten concurrent clients itself.
      - run: node --no-warnings --test --test-concurrency=1 tests/*.test.mjs
