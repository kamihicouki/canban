name: test
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 --version
      # Keep timing-sensitive DB tests independent from other test-file workers.
      # sqlite.test.mjs still exercises ten concurrent clients itself.
      - run: node --no-warnings --test --test-concurrency=1 tests/*.test.mjs

  browser:
    name: browser / generated extension and board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Test generated extension startup, failure and recovery
        env:
          CANBAN_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test tests/chrome-startup.browser.mjs
      - name: Walk through board, timeline and card interactions
        env:
          CANBAN_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test tests/board-smoke.browser.mjs
