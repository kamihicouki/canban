name: Chrome Web Store
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: ZIP更新のみ / publish: 審査申請し承認後に公開'
        type: choice
        options: [upload, publish]
        default: upload
permissions:
  contents: read
concurrency:
  group: chrome-web-store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require same-repository main for production PRs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "production" ]]; then
            if [[ "$HEAD_REF" != "main" || "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo 'production accepts release PRs from this repository main only.' >&2
              exit 1
            fi
          fi
  validate:
    needs: release-source
    uses: ./.github/workflows/test.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package-chrome-web-store.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: canban-chrome-web-store
          path: |
            dist/canban-web-store.zip
            dist/canban-web-store.zip.sha256
          if-no-files-found: error
  deploy:
    needs: [release-source, validate, package]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: canban-chrome-web-store
          path: dist
      - name: Verify release version and checksum
        run: |
          cd dist
          sha256sum -c canban-web-store.zip.sha256
          unzip -p canban-web-store.zip manifest.json > manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("manifest.json")).version; const expected = JSON.parse(fs.readFileSync("../package.json")).version; if (version !== expected) throw new Error("ZIP version must match package.json"); fs.appendFileSync(process.env.GITHUB_ENV, `CWS_PACKAGE_VERSION=${version}\nCWS_PACKAGE_SHA256=${fs.readFileSync("canban-web-store.zip.sha256", "utf8").split(/\s+/)[0]}\n`);'
      - name: Upload / submit to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PACKAGE_PATH: dist/canban-web-store.zip
          CWS_MODE: ${{ inputs.mode || 'publish' }}
          CWS_REPORT_PATH: dist/canban-web-store-submission.json
        run: node scripts/publish-chrome-web-store.mjs
      - name: Save submission receipt
        uses: actions/upload-artifact@v4
        with:
          name: canban-chrome-web-store-submission
          path: dist/canban-web-store-submission.json
          if-no-files-found: error
