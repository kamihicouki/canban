name: Chrome Web Store
on:
  pull_request:
    paths:
      - 'chrome/**'
      - 'ui/**'
      - 'scripts/*chrome*'
      - 'tests/*chrome*'
      - 'package.json'
      - '.github/workflows/chrome-web-store.yml'
  push:
    branches: [main]
    tags: ['chrome-v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: ZIP更新のみ / publish: 審査申請し承認後に公開'
        type: choice
        options: [upload, publish]
        default: upload
permissions:
  contents: read
concurrency:
  group: chrome-web-store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/package-chrome-web-store.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: canban-chrome-web-store
          path: |
            dist/canban-web-store.zip
            dist/canban-web-store.zip.sha256
          if-no-files-found: error
  deploy:
    needs: package
    if: startsWith(github.ref, 'refs/tags/chrome-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: canban-chrome-web-store
          path: dist
      - name: Verify release version and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          cd dist
          sha256sum -c canban-web-store.zip.sha256
          unzip -p canban-web-store.zip manifest.json > manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("manifest.json")).version; if (process.env.IS_TAG === "true" && process.env.RELEASE_TAG !== `chrome-v${version}`) throw new Error("Tag must match manifest version");'
      - name: Upload / submit to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PACKAGE_PATH: dist/canban-web-store.zip
          CWS_MODE: ${{ inputs.mode || 'publish' }}
        run: node scripts/publish-chrome-web-store.mjs
