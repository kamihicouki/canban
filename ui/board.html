function scopeLabel(b) {
  const f = state.filters;
  const dir = f.directory === '__none' ? `${T.category}なし` : b?.directories.find((d) => d.id === f.directory)?.name;
  const parts = [dir && `📂 ${dir}`, f.project && `📁 ${f.project}`, f.folder && `🗂 ${f.folder}`].filter(Boolean);
  return parts.length ? parts.join(' · ') : '📁 すべて';
}
function setScope(patch) {
  Object.assign(state.filters, patch);
  saveFilters();
  state.shown = {};
  state.soloLane = null;
  load();
}
function scopePicker(anchor) {
  const b = state.board;
  const f = state.filters;
  picker(anchor, {
    title: `${T.category}・プロジェクトで絞り込み`, width: 340,
    selected: [f.directory ? `d:${f.directory}` : null, f.project ? `p:${f.project}` : null, f.folder ? `f:${f.folder}` : null, !f.directory && !f.project && !f.folder ? '' : null].filter((x) => x != null),
    items: [
      { value: '', label: 'すべて（絞り込みを解除）' },
      ...directoryItems(false).map((it) => ({ ...it, value: `d:${it.value}`, group: `${T.category}` })),
      ...b.projects.map((p) => ({ value: `p:${p.name}`, label: p.name, hint: p.count, group: 'プロジェクト（Codex のプロジェクト、なければフォルダ名）' })),
      ...(b.folders || []).map((x) => ({ value: `f:${x.name}`, label: x.name, hint: x.count, group: `${T.folder}（Codex のプロジェクトに入っているもの）` })),
    ],
    onPick: (v) => {
      if (!v) return setScope({ directory: '', project: '', folder: '' });
      if (v.startsWith('d:')) setScope({ directory: f.directory === v.slice(2) ? '' : v.slice(2) });
      else if (v.startsWith('f:')) setScope({ folder: f.folder === v.slice(2) ? '' : v.slice(2) });
      else setScope({ project: f.project === v.slice(2) ? '' : v.slice(2) });
    },
  });
}
// Make a category from a Codex project: same name, and its folders so that the
// project's sessions join automatically.
function importCodexProject(anchor) {
  const b = state.board;
  const taken = new Set(b.directories.map((d) => d.name));
  picker(anchor, {
    title: `Codex のプロジェクトから${T.category}を作成`, width: 360,
    items: b.codexProjects.map((p) => ({ value: p.id, label: p.name, hint: taken.has(p.name) ? '作成済み' : p.count, group: p.hostId ? 'リモート' : 'このマシン' })),
    onPick: (id) => {
      const p = b.codexProjects.find((x) => x.id === id);
      if (!p || taken.has(p.name)) return toast(`「${p?.name}」は既にあります`, true);
      act('canban_create_directory', { name: p.name, paths: p.roots.filter((r) => r.startsWith('/')), color: COLORS[(b.directories.length + 1) % COLORS.length] },
        { okMsg: `${T.category}「${p.name}」を作成しました（フォルダ ${p.roots.length} 件）` }).catch(() => {});
    },
  });
}

function toggleSidebar(open = !state.sideOpen) {
  state.sideOpen = open;
  store.set('sidebar', open);
  if (state.board) renderSidebar(state.board);
  if (open) state.sideInput?.focus();
}
function renderSidebar(b) {
  const el = $('#sidebar');
  $('#sideBtn').setAttribute('aria-pressed', String(state.sideOpen));
  el.hidden = !state.sideOpen || state.view === 'analytics';
  if (el.hidden) return;
  const f = state.filters;
  if (!state.sideInput) {
    state.sideInput = h('input', { class: 'side-filter', type: 'search', placeholder: '絞り込み…', 'aria-label': 'サイドバーを絞り込み',
      oninput: (e) => { state.sideQ = e.target.value; renderSidebar(state.board); },
      onkeydown: (e) => {
        if (e.key === 'Escape') { e.target.value = ''; state.sideQ = ''; renderSidebar(state.board); $('#board .card')?.focus(); }
        if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); const r = $('#sidebar .side-row'); e.key === 'Enter' ? r?.click() : r?.focus(); }
      } });
  }
  const q = state.sideQ.trim();
  const hit = matcher(q);
  const count = (n) => h('span', { class: 'count', text: String(n) });

  if (f.swimlane) {

        onclick: (e) => (e.altKey ? setSolo(state.soloLane === lane.name ? null : lane.name) : jumpToLane(lane.name)) },

    secs.push(h('section', {}, head(`レーン（${LANE_MODES[f.swimlane]}）`,
      h('button', { class: 'side-mini', title: 'すべて展開', text: '⊞', onclick: () => setAllLanes(false) }),
      h('button', { class: 'side-mini', title: 'すべてたたむ', text: '⊟', onclick: () => setAllLanes(true) })),

  const dirRow = (d) => h('div', { class: 'side-item side-dir', 'data-dir-id': d.id },

      onclick: () => setScope({ directory: f.directory === d.id ? '' : d.id }) },
      h('span', { class: 'dot', style: { background: d.color ? colorVar(d.color) : 'rgba(255,255,255,0.35)' } }),
      h('span', { class: 'grow ellipsis', text: d.name }), count(d.count)),
    d.id === '__none' ? null : h('button', { class: 'icon-btn', 'aria-label': `${d.name} の設定`, text: '⋯', onclick: (e) => directoryMenu(e.currentTarget, d.id) }));
  const dirs = [...b.directories, { id: '__none', name: `${T.category}なし`, color: null, count: '' }].filter((d) => hit(d.name));
  const add = h('input', { class: 'side-filter', placeholder: `＋ 新しい${T.category}（Enter）`, 'aria-label': `新しい${T.category}`,

// Two-step confirm without window.confirm (blocked in sandboxed iframes).
function confirmInline(host, message) {
  if (host.dataset.confirming === message) { delete host.dataset.confirming; return true; }

  toast(`${message} もう一度押すと実行します`);

  return false;
}

const TRIGGER_LABELS = {

  'pr:merged': 'PR / MR がマージされたら',
  'pr:closed': 'PR / MR が閉じられたら',
  'ci:failed': 'CI が失敗したら',
  'ci:passed': 'CI が通ったら',
};
const PR_STATE = { OPEN: ['open', 'オープン'], MERGED: ['merged', 'マージ済み'], CLOSED: ['closed', 'クローズ'] };
const CHECK_ICON = { passing: ['✓', 'CI 成功'], failing: ['✗', 'CI 失敗'], pending: ['●', 'CI 実行中'] };
function prPill(pr) {
  const [cls, label] = pr.isDraft && pr.state === 'OPEN' ? ['draft', 'ドラフト'] : PR_STATE[pr.state] || ['open', pr.state];
  const ck = CHECK_ICON[pr.checks];
  return h('button', { class: `pill pr-pill pr-${cls}`, title: `${pr.title}\n${label}${ck ? ` / ${ck[1]}` : ''}\n${pr.url}`,
    onpointerdown: (e) => e.stopPropagation(),
    onclick: (e) => { e.stopPropagation(); bridge.openLink(pr.url).catch(() => copyText(pr.url, 'PR の URL')); } },
    `${pr.provider === 'gitlab' ? '!' : '#'}${pr.number}`, ck ? h('span', { class: `ck ck-${pr.checks}`, text: ` ${ck[0]}` }) : null);
}
function renderStatusBar(b) {
  const bar = $('#statusBar');
  bar.replaceChildren(...['running', 'waiting', 'completed', 'aborted'].filter((k) => b.statusCounts[k] || state.filters.status === k).map((k) =>
    h('button', { class: 'status-chip', 'aria-pressed': String(state.filters.status === k), title: `${STATUS_LABELS[k]}だけを表示`,
      onclick: () => { state.filters.status = state.filters.status === k ? '' : k; saveFilters(); state.shown = {}; load(); } },
      h('span', { class: `sdot s-${k}` }), `${STATUS_LABELS[k]} ${b.statusCounts[k]}`)));
}
function hasLive(b) { return (b.statusCounts?.running || 0) + (b.statusCounts?.waiting || 0) > 0; }

const announced = new Set();
function announceAutoMoves(b) {
  for (const m of b.recentAutoMoves || []) {
    const key = `${m.cardId}@${m.at}`;
    if (announced.has(key)) continue;
    announced.add(key);
    if (Date.now() - m.at > 90e3) continue; // only fresh moves get a toast
    const list = b.lists.find((l) => l.id === m.toListId);
    toastAction(`⚡「${m.title}」を「${list?.title ?? m.toListId}」へ移動しました`, '元に戻す', () =>
      act('canban_undo_move', { cardId: m.cardId }, { okMsg: '元に戻しました' }));
  }
}
function toastAction(msg, label, fn) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: 'toast', role: 'status' }, msg, ' ',
    h('button', { class: 'toast-btn', text: label, onclick: () => { t.remove(); fn(); } }));
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 8000);
}

const TARGET_LABELS = { 'new-window': '新規ウィンドウ', 'new-tab': '新規タブ', split: '分割', current: '既存ウィンドウ' };
const TERMINAL_NAMES = { ghostty: 'Ghostty', terminal: 'Terminal.app', iterm: 'iTerm2' };
function launchPrefs() { return state.board?.settings?.launch || { route: 'desktop', terminal: 'terminal', target: 'new-window' }; }
function currentTerminal(terminals = state.board?.terminals || [], settings = state.board?.settings) {
  const want = settings?.launch?.terminal;
  return terminals.find((t) => t.id === want) || terminals[0] || null;
}
function routeLabel(route, launch) {
  if (route === 'desktop' && launch && !launch.desktop) return 'ターミナル';
  return route === 'desktop' ? 'デスクトップアプリ' : `ターミナル・${TARGET_LABELS[launchPrefs().target]}`;
}
// Click modifiers: ⌥ = the other route, ⇧ = terminal new window, ⌘ = terminal new tab, ⌃ = terminal existing window.
function optsFromEvent(e) {
  if (e.shiftKey) return { route: 'terminal', target: 'new-window' };
  if (e.metaKey) return { route: 'terminal', target: 'new-tab' };
  if (e.ctrlKey) return { route: 'terminal', target: 'current' };
  if (e.altKey) return { route: launchPrefs().route === 'desktop' ? 'terminal' : 'desktop' };
  return {};
}
// Keys on a focused card.
const CARD_KEYS = {
  o: {},
  d: { route: 'desktop' },
  t: { route: 'terminal' },
  w: { route: 'terminal', target: 'new-window' },
  n: { route: 'terminal', target: 'new-tab' },
  s: { route: 'terminal', target: 'split' },
  e: { route: 'terminal', target: 'current' },
};
function shortcutHelp() {
  return 'クリック: 既定 / ⌥: もう一方の経路 / ⇧: 新規ウィンドウ / ⌘: 新規タブ / ⌃: 既存ウィンドウ';
}
async function resume(cardId, opts = {}) {
  try {
    const r = await bridge.callTool('canban_open_session', { cardId, ...opts });
    if (r.route === 'desktop') toast(r.exact ? 'デスクトップアプリで開きました' : 'フォルダを開きました（続きはターミナルで再開できます）');
    else toast(`${TERMINAL_NAMES[r.terminal] || 'ターミナル'}で再開しました（${TARGET_LABELS[r.target] || r.target}${r.fellBack ? '・未対応のため新規ウィンドウ' : ''}）`);
  } catch (e) {
    toast(e.message, true);
  }
}

// Clipboard with a visible fallback (sandboxed iframes may block both clipboard and prompt()).
async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました`);
    return;
  } catch {}
  const input = h('input', { class: 'text-input', readonly: true, value: text, 'aria-label': label });
  const p = popover(document.activeElement || document.body, `${label}（⌘C でコピー）`, h('div', {}, input));
  p.style.left = '50%'; p.style.top = '30%'; p.style.transform = 'translateX(-50%)';
  input.focus(); input.select();
}

// Drag & drop (pointer events; works inside sandboxed iframes)
// ======================================================================
function startCardDrag(e, card, el) {
  if (e.button !== 0 || e.target.closest('.labels')) return;
  const sx = e.clientX, sy = e.clientY;
  const rect = el.getBoundingClientRect();
  let started = false;
  const move = (ev) => {
    if (!started) {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
      started = true;
      const ghost = el.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = `${rect.width}px`;
      document.body.append(ghost);
      const ph = h('div', { class: 'placeholder', style: { height: `${rect.height}px` } });
      el.after(ph);
      el.classList.add('drag-source');
      el.style.display = 'none';
      state.drag = { type: 'card', card, el, ghost, ph, dx: sx - rect.left, dy: sy - rect.top, fromList: el.closest('.cards').dataset.listId };
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    ev.preventDefault();
    const d = state.drag;
    d.ghost.style.left = `${ev.clientX - d.dx}px`;
    d.ghost.style.top = `${ev.clientY - d.dy}px`;
    // Dropping a session card onto the middle of a task card links it to the task;
    // near a card's edges it is a normal move. Decide before moving the placeholder.
    // Dropping onto a directory in the sidebar changes the card's directory.
    d.ph.style.display = 'none';
    const dirEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.side-dir');
    d.ph.style.display = '';
    if (d.dropDir !== dirEl) {
      d.dropDir?.classList.remove('drop-target');
      d.dropDir = dirEl;
      d.dropDir?.classList.add('drop-target');
    }
    if (dirEl) { d.ph.style.display = 'none'; return; }
    let under = null;
    if (card.kind !== 'task') {
      d.ph.style.display = 'none';
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card.task');
      if (t) {
        const r = t.getBoundingClientRect();
        if (ev.clientY > r.top + r.height * 0.2 && ev.clientY < r.bottom - r.height * 0.2) under = t;
      }
    }
    if (d.dropTask !== under) {
      d.dropTask?.classList.remove('drop-target');
      d.dropTask = under;
      d.dropTask?.classList.add('drop-target');
    }
    d.ph.style.display = d.dropTask ? 'none' : '';
    if (!d.dropTask) placeCardPlaceholder(ev.clientX, ev.clientY);
    autoScroll(ev.clientX, ev.clientY);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    stopAutoScroll();
    if (!started) return;
    const d = state.drag;
    const cardsEl = d.ph.parentElement;
    const toList = cardsEl?.dataset.listId;
    // Index in the full list from the placeholder's neighbours (works with swimlanes too).
    let idx = -1;
    if (cardsEl) {
      const rest = state.board.lists.find((l) => l.id === toList).cards.filter((c) => c.id !== card.id);
      const near = (dir) => { let n = d.ph[dir]; while (n && (!n.classList.contains('card') || n.classList.contains('drag-source'))) n = n[dir]; return n; };
      const next = near('nextElementSibling');
      const prev = near('previousElementSibling');
      if (next) idx = rest.findIndex((c) => c.id === next.dataset.cardId);
      else if (prev) idx = rest.findIndex((c) => c.id === prev.dataset.cardId) + 1;
      else idx = rest.length;
      if (idx < 0) idx = rest.length;
    }
    d.ghost.remove();
    state.drag = null;
    state.justDragged = true;
    setTimeout(() => (state.justDragged = false), 0);
    if (d.dropDir) {
      const dir = d.dropDir.dataset.dirId;
      d.dropDir.classList.remove('drop-target');
      act('canban_update_card', { cardId: card.id, directory: dir }, { okMsg: dir === '__none' ? `${T.category}から外しました` : `📂 ${state.board.directories.find((x) => x.id === dir)?.name ?? ''} に入れました` }).catch(() => {});
      return;
    }
    // Directory swimlanes: dropping into another lane also moves the card to that directory.
    const laneDir = state.filters.swimlane === 'directory' ? cardsEl?.closest('.lane')?.dataset.dirId : null;
    let dirDone = null;
    if (laneDir && laneDir !== (card.directory?.id || '__none')) {
      dirDone = bridge.callTool('canban_update_card', { cardId: card.id, directory: laneDir }).catch((e) => toast(e.message, true));
      card.directory = state.board.directories.find((x) => x.id === laneDir) || null;
    }
    if (d.dropTask) {
      const taskId = d.dropTask.dataset.cardId;
      d.dropTask.classList.remove('drop-target');
      act('canban_link_session', { taskId, sessionId: card.id }, { okMsg: `${T.taskCard}に紐付けました` }).catch(() => {});
      return;
    }
    const moved = toList && idx >= 0 ? moveCard(card, d.fromList, toList, idx) : (render(), null);
    if (dirDone) Promise.all([dirDone, moved]).then(() => load());
  };
  window.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function placeCardPlaceholder(x, y) {
  const d = state.drag;
  const listEl = listAt(x, y);
  if (!listEl) return;
  const cardsEl = $('.cards', listEl);
  const cards = [...cardsEl.querySelectorAll('.card:not(.drag-source)')];
  let before = null;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = c; break; }
  }
  if (before) { if (d.ph.nextSibling !== before) cardsEl.insertBefore(d.ph, before); }
  else if (cardsEl.lastElementChild !== d.ph) cardsEl.append(d.ph);
}

function listAt(x, y) {
  const cols = [...document.querySelectorAll('.list')].filter((l) => {
    const r = l.getBoundingClientRect();
    return x >= r.left - 6 && x <= r.right + 6;
  });
  if (cols.length <= 1) return cols[0] || null;
  // swimlanes: several columns share x — pick the one in the lane under the pointer
  return cols.find((l) => { const r = (l.closest('.lane') || l).getBoundingClientRect(); return y >= r.top && y <= r.bottom; }) || null;
}

// Compute an order value between neighbours in the target list (orders ascend top→bottom).
function orderAt(listId, index, excludeId) {
  const list = state.board.lists.find((l) => l.id === listId);
  const cards = list.cards.filter((c) => c.id !== excludeId);
  const prev = cards[index - 1], next = cards[index];
  if (prev && next) return (prev.order + next.order) / 2;
  if (prev) return prev.order + 1000;
  if (next) return next.order - 1000;
  return 0;
}

// Keyboard: arrows move the focused card (←→ between lists, ↑↓ within a list,
// Home/End to the top/bottom); ⌥ + arrows only move the focus.
const ARROWS = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, Home: 1, End: 1 };
function moveByKey(card, listId, key) {
  const lists = state.board.lists;
  const li = lists.findIndex((l) => l.id === listId);
  const ci = lists[li].cards.findIndex((c) => c.id === card.id);
  const others = lists[li].cards.length - 1;
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    const target = lists[li + (key === 'ArrowLeft' ? -1 : 1)];
    if (target) moveCard(card, listId, target.id, Math.min(ci, target.cards.length), true);
    return;
  }
  const index = key === 'ArrowUp' ? ci - 1 : key === 'ArrowDown' ? ci + 1 : key === 'Home' ? 0 : others;
  if (index < 0 || index > others || index === ci) return;
  moveCard(card, listId, listId, index, true);
}
function focusNeighbor(listId, cardId, key) {
  const lists = state.board.lists;
  const li = lists.findIndex((l) => l.id === listId);
  const ci = lists[li].cards.findIndex((c) => c.id === cardId);
  let tl = li, tc = ci;
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    const step = key === 'ArrowLeft' ? -1 : 1;
    for (tl = li + step; lists[tl] && !lists[tl].cards.length; tl += step);
    if (!lists[tl]) return;
    tc = Math.min(ci, lists[tl].cards.length - 1);
  } else if (key === 'ArrowUp' || key === 'Home') tc = key === 'Home' ? 0 : Math.max(0, ci - 1);
  else tc = key === 'End' ? lists[li].cards.length - 1 : Math.min(lists[li].cards.length - 1, ci + 1);
  const target = lists[tl].cards[tc];
  if (!target) return;
  ensureShown(lists[tl].id, tc);
  $(`.card[data-card-id="${CSS.escape(target.id)}"]`)?.focus();
}
function ensureShown(listId, index) {
  if (index < (state.shown[listId] || PAGE)) return;
  state.shown[listId] = index + PAGE;
  render();
}

function moveCard(card, fromListId, toListId, index, focusAfter = false) {
  const b = state.board;
  const order = orderAt(toListId, index, card.id);
  // optimistic update
  const from = b.lists.find((l) => l.id === fromListId);
  const to = b.lists.find((l) => l.id === toListId);
  from.cards = from.cards.filter((c) => c.id !== card.id);
  from.count = from.cards.length;
  const moved = { ...card, order, placed: true };
  to.cards.push(moved);
  to.cards.sort((a, c) => a.order - c.order);
  to.count = to.cards.length;
  const newIndex = to.cards.findIndex((c) => c.id === card.id);
  if (newIndex >= (state.shown[toListId] || PAGE)) state.shown[toListId] = newIndex + PAGE;
  render();
  if (focusAfter) $(`.card[data-card-id="${CSS.escape(card.id)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (focusAfter) $(`.card[data-card-id="${CSS.escape(card.id)}"]`)?.focus();
  return bridge.callTool('canban_move_card', { cardId: card.id, toList: toListId, order })
    .catch((e) => { toast(`移動に失敗しました: ${e.message}`, true); load(); });
}

function startListDrag(e, list, listEl) {
  if (e.button !== 0 || e.target.closest('button, input, .list-title') || state.filters.swimlane) return;
  const sx = e.clientX;
  let started = false;
  const move = (ev) => {
    if (!started) {
      if (Math.abs(ev.clientX - sx) < 6) return;
      started = true;
      listEl.classList.add('dragging-list');
      state.drag = { type: 'list', list, listEl };
    }
    ev.preventDefault();
    const boardEl = $('#board');
    const others = [...boardEl.querySelectorAll('.list')].filter((l) => l !== listEl);
    let before = null;
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { before = o; break; }
    }
    if (before) { if (listEl.nextSibling !== before) boardEl.insertBefore(listEl, before); }
    else boardEl.insertBefore(listEl, $('.add-list', boardEl));
    autoScroll(ev.clientX, ev.clientY);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    stopAutoScroll();
    if (!started) return;

    state.drag = null;
    const ids = [...document.querySelectorAll('#board .list')].map((l) => l.dataset.listId);
    const byId = new Map(state.board.lists.map((l) => [l.id, l]));
    state.board.lists = ids.map((id) => byId.get(id));

  window.addEventListener('pointerup', up);

function autoScroll(x, y) {

  const br = boardEl.getBoundingClientRect();

  const listEl = state.drag?.type === 'card' ? listAt(x, y) : null;

$('#board').addEventListener('wheel', (e) => {
  if (e.target.closest('.cards') || state.view === 'analytics' || state.filters.swimlane) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $('#board').scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

// ======================================================================
// Theme & lifecycle
// ======================================================================
function applyTheme(t) {
  const theme = t === 'dark' || t === 'light' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
}
bridge.on('ui/notifications/host-context-changed', (p) => { if (p?.theme) applyTheme(p.theme); });
window.addEventListener('openai:set_globals', (e) => { const t = e.detail?.globals?.theme; if (t) applyTheme(t); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!state.hostTheme) applyTheme(); });

function idle() { return !state.drag && !state.modalOpen && !document.querySelector('.popover, .list-title-input, .composer'); }
let lastPoll = 0;
setInterval(() => {
  const every = state.board && hasLive(state.board) ? 15000 : 60000;
  if (Date.now() - lastPoll < every || document.visibilityState !== 'visible' || !idle()) return;
  lastPoll = Date.now();
  load();
}, 5000);
window.addEventListener('focus', () => { if (idle()) load(); });
window.addEventListener('resize', () => bridge.reportSize());

(async () => {
  const ctx = await bridge.init();
  state.hostTheme = ctx.theme;
  applyTheme(ctx.theme);
  if (ctx.displayMode === 'inline') {
    $('#refresh').after(h('button', { class: 'hbtn', title: '全画面で開く', 'aria-label': '全画面で開く', text: '⤢', onclick: () => bridge.requestFullscreen() }));
  }
  await load();
})();
})();
</script>
</body>
</html>
