<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canban</title>
<style>
:root {
  --board-bg: #0079bf;
  --board-bg-2: #5067c5;
  --header-bg: rgba(0, 0, 0, 0.24);
  --header-fg: #fff;
  --header-dim: rgba(255, 255, 255, 0.78);
  --header-btn: rgba(255, 255, 255, 0.2);
  --header-btn-hover: rgba(255, 255, 255, 0.32);
  --boardbar-bg: rgba(0, 0, 0, 0.12);
  --side-bg: rgba(0, 0, 0, 0.24);
  --side-active: rgba(255, 255, 255, 0.26);
  --drawer-scrim: rgba(9, 30, 66, 0.24);
  --on-board: #fff; --on-board-dim: rgba(255, 255, 255, 0.85); --on-board-btn: rgba(255, 255, 255, 0.2); --on-board-btn-hover: rgba(255, 255, 255, 0.32);
  --pressed-bg: #fff; --pressed-fg: #0c66e4; --primary-bg: #fff; --primary-fg: #0c66e4;
  --tone-run: #216e4e; --tone-run-bg: #dcfff1; --tone-wait: #7f5f01; --tone-wait-bg: #fff7d6;
  --tone-err: #ae2e24; --tone-err-bg: #ffeceb; --tone-done: #0055cc; --tone-done-bg: #e9f2ff;
  --tone-idle: #44546f; --tone-idle-bg: rgba(9, 30, 66, 0.06);
  --ag-codex: #0a7c62; --ag-codex-bg: #dff5ee; --ag-claude: #a8462a; --ag-claude-bg: #fdeee8; --ag-task: #5e4db2; --ag-task-bg: #f3f0ff;
  --logo-bg: #fff;
  --logo-fg: #0c66e4;
  --list-bg: #f1f2f4;
  --list-fg: #172b4d;
  --list-muted: #44546f;
  --card-bg: #fff;
  --card-fg: #172b4d;
  --card-muted: #626f86;
  --card-shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f;
  --card-hover: #f7f8f9;
  --input-bg: #fff;
  --input-border: #8590a2;
  --btn-subtle: rgba(9, 30, 66, 0.06);
  --btn-subtle-hover: rgba(9, 30, 66, 0.14);
  --modal-bg: #f1f2f4;
  --modal-panel: #fff;
  --overlay: rgba(0, 0, 0, 0.64);
  --accent: #0c66e4;
  --danger: #c9372c;
  --warn-bg: #ffecb3;
  --warn-fg: #7f5f01;
  --focus: #388bff;
  --codex: #12a381;
  --claude: #d46f4c;
  --c-gray: #8590a2; --c-blue: #579dff; --c-green: #4bce97; --c-yellow: #f5cd47; --c-orange: #fea362;
  --c-red: #f87168; --c-purple: #9f8fef; --c-pink: #e774bb; --c-sky: #6cc3e0; --c-lime: #94c748;
  --txt-bg: #fbfbfc; --txt-fg: #1d2733; --txt-dim: #6b778c; --note-bg: #fdf0a6; --note-fg: #3d3200;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --board-bg: #1d2125;
  --board-bg-2: #0b2a4a;
  --header-bg: rgba(0, 0, 0, 0.35);
  --header-dim: rgba(255, 255, 255, 0.7);
  --header-btn: rgba(255, 255, 255, 0.12);
  --header-btn-hover: rgba(255, 255, 255, 0.2);
  --boardbar-bg: rgba(0, 0, 0, 0.2);
  --side-bg: rgba(0, 0, 0, 0.32);
  --side-active: rgba(255, 255, 255, 0.18);
  --drawer-scrim: rgba(0, 0, 0, 0.4);
  --pressed-bg: #dee4ea; --pressed-fg: #1d2125; --primary-bg: #579dff; --primary-fg: #1d2125;
  --tone-run: #7ee2b8; --tone-run-bg: #164b35; --tone-wait: #f5cd47; --tone-wait-bg: #533f04;
  --tone-err: #fd9891; --tone-err-bg: #5d1f1a; --tone-done: #85b8ff; --tone-done-bg: #09326c;
  --tone-idle: #9fadbc; --tone-idle-bg: rgba(255, 255, 255, 0.06);
  --ag-codex: #6cd4b6; --ag-codex-bg: #0f3a30; --ag-claude: #f0a281; --ag-claude-bg: #4a2617; --ag-task: #b8acf6; --ag-task-bg: #352c63;
  --logo-bg: #579dff;
  --logo-fg: #1d2125;
  --list-bg: #101204;
  --list-fg: #b6c2cf;
  --list-muted: #8c9bab;
  --card-bg: #22272b;
  --card-fg: #b6c2cf;
  --card-muted: #8c9bab;
  --card-shadow: 0 1px 1px #03040480, 0 0 1px #03040480;
  --card-hover: #2c333a;
  --input-bg: #22272b;
  --input-border: #738496;
  --btn-subtle: rgba(161, 189, 217, 0.08);
  --btn-subtle-hover: rgba(166, 197, 226, 0.16);
  --modal-bg: #323940;
  --modal-panel: #282e33;
  --overlay: rgba(0, 0, 0, 0.72);
  --accent: #579dff;
  --danger: #f87168;
  --warn-bg: #533f04;
  --warn-fg: #f5cd47;
  --txt-bg: #0e1215; --txt-fg: #c9d4df; --txt-dim: #7d8b99; --note-bg: #5c4b0a; --note-fg: #ffeaa0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: var(--list-fg);
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- header ---------- */
/* @include header.css */
/* @include accounts.css */
/* @include task-quick-add.css */
/* @include prompt-composer.css */
.hbtn, .hselect, .hsearch {
  height: 32px; border-radius: 6px; background: var(--header-btn); color: var(--header-fg); border: 0; padding: 0 10px;
}
.hbtn:hover, .hselect:hover { background: var(--header-btn-hover); }
.hbtn[aria-pressed="true"] { background: var(--pressed-bg); color: var(--pressed-fg); }
.hselect option { color: #172b4d; }
#projectBtn { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn, .btn-primary, .btn-danger { white-space: nowrap; flex: none; }
.hsearch { width: 220px; }
.hsearch::placeholder { color: var(--header-dim); }
.hsearch:focus { background: var(--input-bg); color: var(--list-fg); outline: none; }
.seg { display: inline-flex; border-radius: 6px; overflow: hidden; padding: 2px; gap: 2px; background: var(--header-btn); }
.seg button { height: 28px; padding: 0 10px; border-radius: 4px; color: var(--header-fg); font-weight: 600; }
.seg button:hover { background: var(--header-btn-hover); }
.seg button[aria-pressed="true"] { background: var(--pressed-bg); color: var(--pressed-fg); }
.stat { font-size: 12px; opacity: 0.9; white-space: nowrap; }
.errbar { background: var(--warn-bg); color: var(--warn-fg); padding: 6px 12px; font-size: 13px; }

/* ---------- board ---------- */
.board {
  flex: 1; display: flex; align-items: flex-start; gap: 12px;
  padding: 12px; overflow-x: auto; overflow-y: hidden;
}
.list {
  flex: 0 0 272px; width: 272px; min-width: 0; max-height: 100%; display: flex; flex-direction: column;
  background: var(--list-bg); border-radius: 12px; box-shadow: var(--card-shadow);
}
.list.dragging-list { opacity: 0.4; }
.list-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px 12px; cursor: grab; }
.list-head .stripe { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.list-title {
  flex: 1; font-weight: 600; padding: 4px 6px; border-radius: 4px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.list-title-input { flex: 1; font-weight: 600; padding: 3px 6px; border-radius: 4px; border: 2px solid var(--focus); background: var(--input-bg); min-width: 0; }
.count { font-size: 12px; color: var(--list-muted); padding: 0 4px; white-space: nowrap; }
.count.over { color: #fff; background: var(--danger); border-radius: 10px; padding: 0 8px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--list-muted); }
.icon-btn:hover { background: var(--btn-subtle-hover); }
.default-tag { font-size: 11px; color: var(--list-muted); padding: 0 12px 4px; }
.cards { flex: 1; overflow-y: auto; padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.list.over-wip { box-shadow: inset 0 0 0 2px var(--danger); }
.more-btn { margin: 0 8px 8px; padding: 6px 8px; border-radius: 8px; text-align: left; color: var(--list-muted); }
.more-btn:hover { background: var(--btn-subtle-hover); }

.card {
  background: var(--card-bg); color: var(--card-fg); border-radius: 10px; box-shadow: var(--card-shadow);
  padding: 9px 11px 8px; cursor: pointer; user-select: none; position: relative; touch-action: none;
  display: flex; flex-direction: column; gap: 6px;
}
/* Equal-height cards: every slot keeps its place, so the eye and j/k move in a steady rhythm. */
.card.fixed { height: 150px; flex: none; }
.card-top { display: flex; align-items: center; gap: 5px; min-height: 22px; font-size: 11.5px; line-height: 1; min-width: 0; }
.card-top .grow { flex: 1; min-width: 0; }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; padding: 4px 7px 4px 6px; border-radius: 6px; white-space: nowrap; flex: none; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st i.pulse-dot { animation: pulse 1.6s infinite; box-shadow: 0 0 0 0 currentColor; }
.st-run { color: var(--tone-run); background: var(--tone-run-bg); }
.st-wait { color: var(--tone-wait); background: var(--tone-wait-bg); }
.st-err { color: var(--tone-err); background: var(--tone-err-bg); }
.st-done { color: var(--tone-done); background: var(--tone-done-bg); }
.st-idle { color: var(--tone-idle); background: var(--tone-idle-bg); }
.ag { font-weight: 700; padding: 4px 6px; border-radius: 6px; white-space: nowrap; flex: none; }
.ag-codex { color: var(--ag-codex); background: var(--ag-codex-bg); }
.ag-claude { color: var(--ag-claude); background: var(--ag-claude-bg); }
.ag-task { color: var(--ag-task); background: var(--ag-task-bg); }
.flag { font-size: 11px; font-weight: 600; padding: 3px 5px; border-radius: 5px; background: var(--tone-idle-bg); color: var(--card-muted); white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; flex: none; }
.flag-new { background: var(--accent); color: #fff; }
.card-top .labels { margin: 0; flex-wrap: nowrap; flex: none; }
.card-top .labels:not(.expanded) .chip { height: 6px; min-width: 22px; }
.card-slot { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card-slot:empty { display: none; }
.card.fixed .card-slot { height: 22px; overflow: hidden; justify-content: center; }
.slot-empty { font-size: 12px; color: var(--card-muted); opacity: .8; }
.card .meta > * { white-space: nowrap; }
.card.fixed .meta { flex-wrap: nowrap; overflow: hidden; margin-top: auto; }
.card.fixed .meta > * { flex: none; }
/* Only the category and branch give way; flags and the time keep their size. */
.card.fixed .meta > .dir-pill, .card.fixed .meta > .ellipsis, .card.fixed .meta > .branch, .card.fixed .meta > .acct-chip { flex: 0 1 auto; min-width: 28px; overflow: hidden; text-overflow: ellipsis; }
.card.fixed .meta > .dir-pill { flex-shrink: .4; min-width: 64px; }
.card.fixed .card-slot > :not(:first-child) { display: none; }
.card.fixed .card-slot .snippet { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-end { margin-left: auto; flex: none !important; padding-left: 4px; white-space: nowrap; }
.card:hover { background: var(--card-hover); }
.card.is-archived { opacity: 0.6; }
.card.drag-source { opacity: 0.25; }
.card .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { height: 8px; min-width: 40px; border-radius: 4px; }
.labels.expanded .chip { height: 16px; font-size: 12px; line-height: 16px; padding: 0 6px; color: #172b4d; font-weight: 600; min-width: 0; }
.card .title { word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; font-weight: 700; line-height: 1.4; }
.card.fixed .title { -webkit-line-clamp: 2; min-height: 2.8em; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-top: 6px; border-top: 1px dashed var(--btn-subtle-hover); font-size: 12px; color: var(--card-muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; color: #fff; line-height: 16px; }
.badge.codex { background: var(--codex); }
.badge.claude { background: var(--claude); }
.pill { display: inline-flex; align-items: center; gap: 3px; border-radius: 3px; padding: 0 4px; }
.pill.prio-high { background: #ffd5d2; color: #ae2e24; }
.pill.prio-medium { background: #fff7d6; color: #7f5f01; }
.pill.prio-low { background: #dcfff1; color: #216e4e; }
.pill.due-over { background: var(--danger); color: #fff; }
.ellipsis { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placeholder { border-radius: 8px; background: var(--btn-subtle-hover); flex: none; }
.ghost {
  position: fixed; z-index: 1000; pointer-events: none; transform: rotate(3deg);
  box-shadow: 0 8px 16px -4px #091e4240, 0 0 1px #091e424f; opacity: 0.95;
}

.add-list { flex: 0 0 272px; }
.add-list-btn {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; color: var(--on-board);
  background: var(--on-board-btn); font-weight: 500;
}
.add-list-btn:hover { background: var(--on-board-btn-hover); }
.composer { background: var(--list-bg); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.text-input {
  width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--input-bg);
}
.text-input:focus { outline: none; border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
.row { display: flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn { background: var(--btn-subtle); padding: 6px 12px; border-radius: 4px; }
.btn:hover { background: var(--btn-subtle-hover); }
.btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; border-radius: 4px; }

/* ---------- popover ---------- */
.popover {
  position: fixed; z-index: 900; width: 304px; background: var(--modal-panel); color: var(--list-fg);
  border-radius: 8px; box-shadow: 0 8px 12px #091e4226, 0 0 1px #091e424f; padding: 12px;
}
.popover h3 { margin: 0 0 8px; font-size: 14px; text-align: center; color: var(--list-muted); font-weight: 600; }
.popover .close { position: absolute; right: 6px; top: 6px; }
.menu-item { display: block; width: 100%; text-align: left; padding: 6px 12px; border-radius: 4px; }
.menu-item:hover { background: var(--btn-subtle-hover); }
.menu-item.danger { color: var(--danger); }
.sep { height: 1px; background: var(--btn-subtle-hover); margin: 8px 0; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatch { height: 28px; border-radius: 4px; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--list-muted); margin: 8px 0 4px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 800; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 48px 16px; }
.modal { width: 840px; max-width: 100%; background: var(--modal-bg); color: var(--list-fg); border-radius: 12px; padding: 20px 24px 24px; position: relative; }
.modal .close { position: absolute; right: 12px; top: 12px; }
.modal h2 { margin: 0 40px 4px 0; font-size: 20px; line-height: 26px; word-break: break-word; }
.modal .sub { color: var(--list-muted); font-size: 13px; }
.modal-grid { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 24px; margin-top: 16px; }
.section-title { font-weight: 600; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--list-muted); }
.kv dd { margin: 0; word-break: break-all; }
textarea.note { width: 100%; min-height: 96px; resize: vertical; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--input-bg); }
.side-btn { display: flex; width: 100%; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; background: var(--btn-subtle); margin-bottom: 8px; text-align: left; }
.side-btn:hover { background: var(--btn-subtle-hover); }
.label-toggle { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px; border-radius: 4px; }
.label-toggle:hover { background: var(--btn-subtle-hover); }
.label-toggle .sw { flex: 1; height: 28px; border-radius: 4px; padding: 0 10px; line-height: 28px; color: #172b4d; font-weight: 600; text-align: left; }
.msg { background: var(--modal-panel); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--list-muted); margin-bottom: 2px; }
.msg.user { border-left: 3px solid var(--accent); }
.muted { color: var(--list-muted); font-size: 12px; }
/* ---------- live session feed (like the agent apps' own conversation view) ---------- */
.card .activity { border-radius: 5px; padding: 3px 7px; background: var(--tone-idle-bg); font-size: 12px; line-height: 16px; color: var(--card-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.sig-row { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 11px; line-height: 15px; color: var(--card-muted); }
.sig-row span { white-space: nowrap; }
.sig-warn { color: var(--c-orange); font-weight: 600; }
.sig-hot { color: var(--c-red); font-weight: 600; }
.sig-box { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--modal-panel); font-size: 12px; display: grid; gap: 6px; }
.sig-box .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sig-box .chip { padding: 1px 6px; border-radius: 4px; background: var(--btn-subtle); }
.meter { display: flex; align-items: center; gap: 8px; }
.meter .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--btn-subtle); overflow: hidden; }
.meter .bar > i { display: block; height: 100%; background: var(--c-blue); }
.meter .bar > i.warn { background: var(--c-orange); }
.meter .bar > i.hot { background: var(--c-red); }
.plan-step { display: flex; gap: 6px; }
.plan-step.done { color: var(--list-muted); text-decoration: line-through; }
.plan-step.doing { font-weight: 600; }
.file-list { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--list-muted); word-break: break-all; }
.limits { display: inline-flex; gap: 8px; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.2); color: #fff; font-size: 12px; white-space: nowrap; }
.limits[hidden] { display: none; }
.viewer-pill { background: var(--c-purple); color: #fff; }
.live-badge { font-size: 11px; font-weight: 600; color: var(--list-muted); display: inline-flex; align-items: center; gap: 4px; }
.live-badge.on::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c-green); }
.feed-wrap { position: relative; margin-bottom: 8px; }
.feed { max-height: min(460px, 55vh); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px; background: var(--modal-panel); font-size: 13px; }
.fi { white-space: pre-wrap; word-break: break-word; line-height: 19px; }
.fi-user { align-self: flex-end; max-width: 85%; background: var(--accent); color: #fff; border-radius: 12px 12px 4px 12px; padding: 6px 10px; }
.fi-asst { padding: 2px 4px; }
.fi-note { padding: 0 4px; color: var(--list-muted); font-size: 12px; }
.fi-think, .fi-tool { font-size: 12px; color: var(--list-muted); padding: 0 4px; }
.fi-think summary, .fi-tool summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; min-width: 0; }
.fi-think summary::-webkit-details-marker, .fi-tool summary::-webkit-details-marker { display: none; }
.fi-tool .tn { font-weight: 600; color: var(--list-fg); flex: none; }
.fi-tool .ts { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fi-tool pre, .fi-think .tt { margin: 4px 0 2px 20px; padding: 6px 8px; border-radius: 6px; background: var(--btn-subtle); font-size: 11px; line-height: 15px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
.ti { width: 14px; flex: none; text-align: center; }
.ti.ok { color: var(--c-green); }
.ti.error { color: var(--c-red); }

.card.unread { box-shadow: inset 3px 0 0 var(--accent), var(--card-shadow); }

.board.with-lanes { flex-direction: column; align-items: stretch; overflow: auto; gap: 6px; padding-top: 0; }

/* ---------- sidebar ---------- */

<script>
// Display names of Canban's own concepts, kept apart from the agents' terms
// (docs: README「用語」). Change a word here to rename it everywhere in the UI.
const T = { category: 'カテゴリ', automation: '自動化', taskCard: 'タスクカード', aiApps: 'AI Apps', folder: 'フォルダ' };
{
  const set = (sel, attr, v) => { const el = document.querySelector(sel); if (el) (attr === 'text' ? (el.textContent = v) : el.setAttribute(attr, v)); };
  set('#projectBtn', 'title', `${T.category}で絞り込み（p）`);
  set('#sidebar', 'aria-label', `レーン・${T.category}`);
  set('.seg[data-pri="9"]', 'aria-label', T.aiApps);
}

(() => {
'use strict';

// ======================================================================
// Host bridge: MCP Apps (postMessage JSON-RPC) with window.openai fallback
// ======================================================================
const bridge = (() => {
  let nextId = 1;
  const waiting = new Map();
  const listeners = {};
  let nativePort = null;
  const nativeChunks = new Map();
  const isChromeExtension = () => location.protocol === 'chrome-extension:' && !!globalThis.chrome?.runtime?.connectNative;
  const on = (m, fn) => ((listeners[m] ||= []).push(fn));
  const emit = (m, p) => (listeners[m] || []).forEach((fn) => { try { fn(p); } catch (e) { console.error(e); } });

  function post(msg) { window.parent.postMessage(msg, '*'); }
  function request(method, params, timeout = 60000) {
    const id = nextId++;
    post({ jsonrpc: '2.0', id, method, params });
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { waiting.delete(id); reject(new Error(`${method} がタイムアウトしました`)); }, timeout);
      waiting.set(id, { resolve: (v) => { clearTimeout(t); resolve(v); }, reject: (e) => { clearTimeout(t); reject(e); } });
    });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method, params }); }

  function settleNative(message) {
    const w = waiting.get(message?.id);
    if (!w) return;
    waiting.delete(message.id);
    clearTimeout(w.timer);
    if (message.error) w.reject(new Error(message.error.message || 'Canban Native Messaging Host error'));
    else w.resolve(message.result ?? {});
  }

  function consumeNativeMessage(message) {
    if (message?.__canbanChunk !== 1) { settleNative(message); return; }
    const { id, index, total, data } = message;
    if (!waiting.has(id) || !Number.isInteger(index) || !Number.isInteger(total) || total < 1 || index < 0 || index >= total || typeof data !== 'string') return;
    const item = nativeChunks.get(id) || { total, parts: new Array(total).fill(undefined) };
    if (item.total !== total || item.parts[index]) return;
    item.parts[index] = data;
    nativeChunks.set(id, item);
    if (item.parts.some((part) => typeof part !== 'string')) return;
    nativeChunks.delete(id);
    try {
      const decoded = item.parts.map((part) => atob(part));
      const size = decoded.reduce((n, part) => n + part.length, 0);
      const bytes = new Uint8Array(size);
      let offset = 0;
      for (const part of decoded) {
        for (let i = 0; i < part.length; i++) bytes[offset++] = part.charCodeAt(i);
      }
      settleNative(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (error) {
      const w = waiting.get(id);
      if (w) { waiting.delete(id); clearTimeout(w.timer); w.reject(error); }
    }
  }

  function connectNative() {
    if (nativePort) return nativePort;
    try {
      nativePort = chrome.runtime.connectNative('com.kamihicouki.canban');
      nativePort.onMessage.addListener(consumeNativeMessage);
      nativePort.onDisconnect.addListener(() => {
        const reason = chrome.runtime.lastError?.message || 'Native Messaging Hostとの接続が切れました';
        nativePort = null;
        for (const [id, w] of waiting) { clearTimeout(w.timer); w.reject(new Error(reason)); }
        waiting.clear();
        nativeChunks.clear();
      });
      return nativePort;
    } catch (error) {
      nativePort = null;
      throw new Error(`Canban Native Messaging Hostに接続できません: ${error.message}`);
    }
  }

  function nativeRequest(method, params, timeout = 60000) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { waiting.delete(id); nativeChunks.delete(id); reject(new Error(`${method} がタイムアウトしました`)); }, timeout);
      waiting.set(id, { resolve, reject, timer });
      try { connectNative().postMessage({ jsonrpc: '2.0', id, method, params }); }
      catch (error) { waiting.delete(id); clearTimeout(timer); reject(error); }
    });
  }

  window.addEventListener('message', (ev) => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && (m.result !== undefined || m.error !== undefined) && waiting.has(m.id)) {
      const w = waiting.get(m.id); waiting.delete(m.id);
      m.error ? w.reject(new Error(m.error.message || 'Host error')) : w.resolve(m.result);
      return;
    }
    if (m.method) {
      emit(m.method, m.params);
      if (m.id != null) post({ jsonrpc: '2.0', id: m.id, result: {} }); // ack host requests (e.g. teardown)
    }
  });

  const openai = () => window.openai && typeof window.openai.callTool === 'function' ? window.openai : null;

  async function init() {
    if (openai()) {
      return { theme: window.openai.theme, displayMode: window.openai.displayMode };
    }
    if (isChromeExtension()) return { theme: null, displayMode: 'fullscreen', locale: 'ja-JP' };
    try {
      const res = await request('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: { name: 'canban', version: '__CANBAN_VERSION__' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
      }, 8000);
      notify('ui/notifications/initialized', {});
      return res?.hostContext || {};
    } catch (e) {
      console.warn('ui/initialize failed', e);
      return {};
    }
  }

  async function callTool(name, args = {}) {
    let res;
    const t0 = performance.now();
    const pending = !!hooks.pending?.();
    const concurrent = !openai() && isChromeExtension();
    if (openai()) res = await window.openai.callTool(name, args);
    else if (concurrent) res = await nativeRequest('tools/call', { name, arguments: args });
    else res = await request('tools/call', { name, arguments: args });
    hooks.after?.(name, t0, pending, concurrent);
    if (res?.isError) {
      const text = (res.content || []).map((c) => c.text).filter(Boolean).join('\n');
      throw Object.assign(new Error(text || `${name} failed`), { code: res.structuredContent?.code || null });
    }
    return res?.structuredContent ?? res;
  }

  function openLink(url) {
    if (openai() && window.openai.openExternal) return window.openai.openExternal({ href: url });
    if (isChromeExtension()) return chrome.tabs.create({ url });
    return request('ui/open-link', { url }, 5000);
  }
  function requestFullscreen() {
    if (openai() && window.openai.requestDisplayMode) return window.openai.requestDisplayMode({ mode: 'fullscreen' }).catch(() => {});
    if (isChromeExtension()) return Promise.resolve();
    return request('ui/request-display-mode', { mode: 'fullscreen' }, 3000).catch(() => {});
  }
  function reportSize() {
    if (isChromeExtension()) return;
    notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: Math.max(560, window.innerHeight) });
  }
  const hooks = {}; // pending(): a long poll is open; after(name, startedAt, pending, concurrent)
  return { init, callTool, on, openLink, requestFullscreen, reportSize, hooks };
})();

// ======================================================================
// State
// ======================================================================
// @include workspace-model.js
// @include card-overlay-model.js
// @include prompt-composer.js
const PAGE = 40;
const COLORS = ['gray', 'blue', 'green', 'yellow', 'orange', 'red', 'purple', 'pink', 'sky', 'lime'];
const COLOR_NAMES = { gray: 'グレー', blue: '青', green: '緑', yellow: '黄', orange: 'オレンジ', red: '赤', purple: '紫', pink: 'ピンク', sky: '水色', lime: 'ライム' };
const SHARED_UI_KEYS = ['filters', 'themePref', 'layout', 'cardFit', 'sidebar', 'view', 'workspacePage', 'labelsExpanded', 'paneGlobal', 'cardLayouts', 'cardWidths', 'collapsedLanes'];
const sharedUi = { revision: null, ready: false, dirty: false, blocked: false, applying: false, inflight: false, generation: 0, timer: null, checkTimer: null };
const store = {
  get(k, d) { try { const v = localStorage.getItem(`sk:${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    let changed = true;
    try {
      const serialized = JSON.stringify(v);
      changed = localStorage.getItem(`sk:${k}`) !== serialized;
      localStorage.setItem(`sk:${k}`, serialized);
    } catch {}
    if (changed && SHARED_UI_KEYS.includes(k) && sharedUi.ready && !sharedUi.applying) {
      sharedUi.dirty = true;
      sharedUi.generation++;
      store.cache('sharedUiPending', { revision: sharedUi.revision });
      scheduleSharedUiSave();
    }
  },
  cache(k, v) { try { localStorage.setItem(`sk:${k}`, JSON.stringify(v)); } catch {} },
};
const DEFAULT_FILTERS = { agent: 'all', host: '', account: '', status: '', project: '', directory: '', label: '', q: '', days: 30, includeArchived: false, includeSubagents: false, includeHidden: false, groupBranch: false, fulltext: false, swimlane: '', laneHeight: 'normal' };
const LANE_HEIGHTS = { compact: ['コンパクト', '240px'], normal: ['標準', '420px'], full: ['すべて', 'none'] };
const state = {
  board: null,
  filters: { ...DEFAULT_FILTERS, ...store.get('filters', {}) },
  sideOpen: store.get('sidebar', window.innerWidth > 900),
  themePref: store.get('themePref', 'system'),
  layout: store.get('layout', 'trello'),
  cardFit: store.get('cardFit', 'fixed') === 'auto' ? 'auto' : 'fixed',
  sideQ: '',
  soloLane: null,
  lanes: [],
  view: store.get('view', 'board'),
  shown: {},              // listId -> number of cards rendered
  labelsExpanded: store.get('labelsExpanded', false),
  drag: null,
  busy: false,
};

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v; // trusted markup only (icons)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv) : (el.style[sk] = sv);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const colorVar = (c) => (c ? `var(--c-${c})` : 'transparent');

function relTime(ms) {
  if (!ms) return '';
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return 'たった今';
  if (d < 3600) return `${Math.floor(d / 60)}分前`;
  if (d < 86400) return `${Math.floor(d / 3600)}時間前`;
  if (d < 86400 * 30) return `${Math.floor(d / 86400)}日前`;
  return new Date(ms).toLocaleDateString('ja-JP');
}
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString('ja-JP') : '-');

let toastTimer;
function toast(msg, isError = false) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: `toast${isError ? ' error' : ''}`, role: 'status', text: msg });
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isError ? 5000 : 2200);
}

async function act(name, args, { reload = true, okMsg } = {}) {
  live.ownActAt = Date.now();
  try {
    const res = await bridge.callTool(name, args);
    if (okMsg) toast(okMsg);
    if (reload) await load();
    return res;
  } catch (e) {
    toast(e.message, true);
    await load();
    throw e;
  }
}

// ======================================================================
// Loading
// ======================================================================
let loadSeq = 0;
function migrateLegacyScope(board) {
  if (store.get('taskAttributeFilters', false)) return false;
  store.set('taskAttributeFilters', true);
  const f = state.filters;
  if (!f.project && !f.folder && f.swimlane !== 'project') return false;
  if (f.project && !f.directory) f.directory = board.directories.find(d => d.name === f.project)?.id || '';
  f.project = ''; f.folder = '';
  if (f.swimlane === 'project') f.swimlane = 'directory';
  saveFilters();
  return true;
}
async function load({ refresh = false, throwOnError = false } = {}) {
  if (state.view === 'analytics') return loadAnalytics({ throwOnError });
  const seq = ++loadSeq;
  const f = state.filters;
  const args = { agent: f.agent, q: f.q, days: Number(f.days), includeArchived: f.includeArchived, includeSubagents: f.includeSubagents, includeHidden: f.includeHidden, pinnedOnly: !!f.pinnedOnly, groupBranch: !!f.groupBranch, fulltext: !!f.fulltext, refresh };
  if (f.project) args.project = f.project;
  if (f.folder) args.folder = f.folder;
  if (f.section) args.section = f.section;
  if (f.directory) args.directory = f.directory;
  if (f.label) args.label = f.label;
  if (f.host) args.host = f.host;
  if (f.account) args.account = f.account;
  if (f.status) args.status = f.status;
  try {
    const board = await bridge.callTool('canban_get_board', args);
    if (seq !== loadSeq) return;
    state.board = board;
    if (migrateLegacyScope(board)) return load();
    render();
    reconcileCards(board);
  } catch (e) {
    if (seq !== loadSeq) return;
    $('#board').replaceChildren(h('div', { class: 'loading', text: `読み込みに失敗しました: ${e.message}` }));
    if (throwOnError) throw e;
  }
}

function saveFilters() { store.set('filters', state.filters); }

// ======================================================================
// Rendering
// ======================================================================
function render() {
  const b = state.board;
  if (!b || state.view === 'analytics') return;
  if (state.drag) return; // don't disturb an active drag

  // header
  document.querySelectorAll('.seg button[data-agent]').forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.agent === state.filters.agent)));
  $('#projectBtn .lbl').textContent = `${scopeLabel(b)} ▾`;
  $('#projectBtn').setAttribute('aria-pressed', String(!!(state.filters.project || state.filters.directory || state.filters.folder || state.filters.section || state.filters.label)));
  $('#days').value = String(state.filters.days);
  for (const btn of $$('#fitSeg [data-card-fit]')) btn.setAttribute('aria-pressed', String(btn.dataset.cardFit === state.cardFit));
  renderAccountsButton(b);
  // The board bar names what the board is showing (Trello's board title).
  const scope = scopeLabel(b);
  $('#logo').textContent = scope === 'すべて' ? 'すべてのセッション' : scope;
  $('#logo').title = `表示 ${b.totals.shown} / Codex ${b.totals.codex}・Claude ${b.totals.claude}`;
  renderStatusBar(b);
  $('#seenBtn').hidden = !b.lists.some((l) => l.cards.some((c) => c.unread));
  $('#perfBtn').hidden = !b.perf?.slow?.length;
  fitHeader();
  announceAutoMoves(b);
  workspace.render(b);
  if (workspace.utilityPage()) return;
  const eb = $('#errbar');
  eb.hidden = !b.errors.length;
  eb.textContent = b.errors.join(' / ');

  const boardEl = $('#board');
  const scroll = boardEl.scrollLeft;
  const listScroll = new Map();
  const listScrollKey = (l) => JSON.stringify([l.closest('.lane')?.dataset.lane || '', l.dataset.listId]);
  const scrollTop = boardEl.scrollTop;
  boardEl.querySelectorAll('.list').forEach((l) => listScroll.set(listScrollKey(l), $('.cards', l)?.scrollTop || 0));

  const focused = document.activeElement;
  const focusedCard = boardEl.contains(focused) ? focused.closest('.card')?.dataset.cardId : null;
  const frag = document.createDocumentFragment();
  boardEl.classList.remove('analytics-mode');
  boardEl.classList.toggle('with-lanes', !!state.filters.swimlane);
  boardEl.style.setProperty('--lane-max-h', (LANE_HEIGHTS[state.filters.laneHeight] || LANE_HEIGHTS.normal)[1]);
  state.lanes = state.filters.swimlane ? buildLanes(b, state.filters.swimlane) : [];
  if (state.soloLane && !state.lanes.some((l) => l.key === state.soloLane)) state.soloLane = null;
  if (state.filters.swimlane) {
    if (state.soloLane) {
      frag.append(h('div', { class: 'solo-bar' }, `「${state.lanes.find(l => l.key === state.soloLane)?.name}」だけを表示中`,
        h('button', { class: 'lane-solo', text: '◀ 全レーンに戻る', onclick: () => setSolo(null) })));
    }
    for (const lane of state.lanes) if (!state.soloLane || lane.key === state.soloLane) frag.append(renderLane(lane));
  } else {
    for (const list of b.lists) frag.append(renderList(list));
    frag.append(renderAddList());
  }
  boardEl.replaceChildren(frag);
  renderSidebar(b);
  paintLayoutChrome();
  if (focused && focused !== document.body && boardEl.contains(focused)) focused.focus({ preventScroll: true });
  else if (focusedCard) $(`.card[data-card-id="${CSS.escape(focusedCard)}"]`, boardEl)?.focus({ preventScroll: true });
  boardEl.scrollLeft = scroll;
  boardEl.scrollTop = scrollTop;
  boardEl.querySelectorAll('.list').forEach((l) => { const c = $('.cards', l); if (c) c.scrollTop = listScroll.get(listScrollKey(l)) || 0; });
  bridge.reportSize();
}

// Shared by session and task cards: drag, click to open (the card floats above the board), ▶ resume, keyboard.
function attachCardBehavior(el, card, list, onResume) {
  el.addEventListener('pointerdown', (e) => startCardDrag(e, card, el));
  el.addEventListener('click', () => { if (!state.justDragged) openCard(card.id); });
  if (onResume) {
    el.append(h('button', { class: 'card-resume', title: `再開（${shortcutHelp()}）`, 'aria-label': `${card.title} を再開`, text: '▶',
      onpointerdown: (e) => e.stopPropagation(),
      onclick: (e) => { e.stopPropagation(); onResume(optsFromEvent(e)); } }));
  }
  el.addEventListener('keydown', (e) => {
    if (e.target !== el) return;
    if (e.key === 'Enter') openCard(card.id);
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    if (plain && CARD_ATTR_KEYS[e.key]) { e.preventDefault(); e.stopPropagation(); return CARD_ATTR_KEYS[e.key](el, card, list); }
    const k = onResume && !e.metaKey && !e.ctrlKey && !e.altKey && CARD_KEYS[e.key.toLowerCase()];
    if (k) { e.preventDefault(); onResume(k); }
    if (ARROWS[e.key] && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      if (e.altKey) focusNeighbor(list.id, card.id, e.key);
      else moveByKey(card, list.id, e.key);
    }
  });
  return el;
}

function dirPill(d) {

// Attribute keys on a focused card (Trello-like): l = labels, g = directory, m = move, h = hide.
const CARD_ATTR_KEYS = {
  l: (el, card) => labelPicker(el, card.id, card, () => {}),
  g: (el, card) => directoryPicker(el, card),
  m: (el, card, list) => listPicker(el, card, list.id),
  h: (el, card) => {
    act('canban_update_card', { cardId: card.id, hidden: !card.hidden }).then(() =>
      toastAction(card.hidden ? '再表示しました' : `「${card.title}」を隠しました`, '元に戻す', () => act('canban_update_card', { cardId: card.id, hidden: !!card.hidden }))).catch(() => {});
  },
};
function listPicker(anchor, card, fromListId) {
  const lists = state.board.lists;
  picker(anchor, {
    title: 'リストへ移動', selected: [fromListId],
    items: lists.map((l, i) => ({ value: l.id, label: l.title, color: l.color, hint: `${l.count}${i < 9 ? ` · ${i + 1}` : ''}`, keywords: String(i + 1) })),
    onPick: (to) => { if (to !== fromListId) moveCard(card, fromListId, to, 0, true); },
  });
}
function directoryItems(withAuto = true) {
  const b = state.board;
  return [
    withAuto ? { value: '', label: '自動（エージェントのカテゴリに従う）', hint: '' } : null,
    { value: '__none', label: 'カテゴリ無し' },

// Choose/create a category, or explicitly opt out of the agent's automatic category.
function directoryPicker(anchor, card, { cwd = card.cwd, explicit, after } = {}) {
  const cur = explicit !== undefined ? explicit || '' : card.directory?.id || '';
  const set = async (v) => {
    await act('canban_update_card', { cardId: card.id, directory: v || null }, { okMsg: v === '__none' ? `${T.category}から外しました` : v ? `📂 ${state.board.directories.find((d) => d.id === v)?.name ?? ''} に入れました` : '自動に戻しました' }).catch(() => {});

// A task card: user-made, with its linked sessions listed inside.
function renderTaskCard(card, list) {
  const el = cardShell(card, ' task');
  el.append(h('div', { class: 'card-top' },
    statusTag(card.status), agentTag('task'),

function renderAddList() {

  };

function editListTitle(titleEl, list) {
  if (state.drag) return;
  const input = h('input', { class: 'list-title-input', value: list.title, maxlength: 80, 'aria-label': 'リスト名' });
  let done = false;
  const commit = async (save) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (save && v && v !== list.title) await act('canban_update_list', { listId: list.id, title: v }).catch(() => {});
    else render();
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') commit(true); if (e.key === 'Escape') commit(false); };
  input.onblur = () => commit(true);
  input.onpointerdown = (e) => e.stopPropagation();
  titleEl.replaceWith(input);
  input.select();
}

// ======================================================================
// Popovers
// ======================================================================
// Popovers remember what had focus and give it back when they close (keyboard flow).
// A `stack` popover opens on top of another one (e.g. a picker inside a menu).
function refocus(el) {
  if (!el || el === document.body) return;
  if (el.isConnected) return el.focus({ preventScroll: true });
  const id = el.dataset?.cardId;
  if (id) $(`.card[data-card-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
}
function closePopover(p = null) {
  const all = [...document.querySelectorAll('.popover')];
  const gone = p ? all.slice(all.indexOf(p)) : all;
  if (!gone.length || (p && !p.isConnected)) return;
  gone.forEach((x) => { x.remove(); x.onClose?.(); });
  if (!document.activeElement || document.activeElement === document.body) refocus(gone[0].returnFocus);
}
function popover(anchor, title, body, { width, stack = false } = {}) {
  if (anchor?._pagePanel) {
    anchor._pagePanel.replaceChildren(body);
    workspace.trackDrafts(body);
    return anchor._pagePanel;
  }
  const returnFocus = stack ? document.activeElement : document.querySelector('.popover')?.returnFocus || document.activeElement;
  const r = anchor.getBoundingClientRect();
  if (!stack) closePopover();

// Filterable picker (keyword filter, ↑↓ / Enter / Esc). Used for every
// attribute choice: lists, labels, directories, projects, machines, views…
// ======================================================================
const norm = (s) => String(s ?? '').normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));

  const sel = new Set(selected);
  const input = h('input', { class: 'text-input picker-input', placeholder, 'aria-label': `${title}を絞り込み`, autocomplete: 'off' });
  const listEl = h('div', { class: 'picker-list', role: 'listbox', 'aria-label': title, 'aria-multiselectable': multi ? 'true' : null });
  let active = 0, rows = [];
  const mark = () => {
    listEl.querySelectorAll('.picker-row').forEach((el) => el.classList.toggle('active', Number(el.dataset.i) === active));
    listEl.querySelector('.picker-row.active')?.scrollIntoView({ block: 'nearest' });
  };
  const paint = () => {
    const raw = input.value.trim();
    const hit = matcher(raw);
    rows = items.filter((it) => hit(`${it.group || ''} ${it.label} ${it.hint ?? ''} ${it.keywords || ''} ${it.badge || ''}`)).slice(0, limit).map((it) => ({ it }));
    if (onCreate && raw && !items.some((it) => norm(it.label) === norm(raw))) rows.push({ create: raw });
    active = Math.max(0, Math.min(active, rows.length - 1));
    let group;
    const out = [];
    rows.forEach((r, i) => {
      if (r.it?.group && r.it.group !== group) { group = r.it.group; out.push(h('div', { class: 'picker-group', text: group })); }
      const on = r.it && sel.has(r.it.value);

        onpointerdown: (e) => e.preventDefault(), onclick: () => choose(i), onmousemove: () => { if (active !== i) { active = i; mark(); } } },
        r.create ? h('span', { class: 'grow', text: `＋「${r.create}」${createText}` }) : [
          h('span', { class: 'picker-check', text: on ? '✓' : '' }),
          r.it.badge ? h('span', { class: 'picker-badge', text: r.it.badge }) : null,
          r.it.color ? h('span', { class: 'sdot', style: { background: colorVar(r.it.color) } }) : null,
          r.it.dot ? h('span', { class: `sdot s-${r.it.dot}` }) : null,
          h('span', { class: 'grow ellipsis', text: r.it.label }),
          r.it.hint != null && r.it.hint !== '' ? h('span', { class: 'muted', text: String(r.it.hint) }) : null]));

    listEl.replaceChildren(...out);

  const choose = (i) => {
    const r = rows[i];
    if (!r) return;

    if (multi) {
      sel.has(r.it.value) ? sel.delete(r.it.value) : sel.add(r.it.value);
      onPick(r.it.value, sel.has(r.it.value), [...sel]);

    else if (e.key === 'ArrowUp' || (e.key === 'p' && e.ctrlKey)) { e.preventDefault(); active = Math.max(0, active - 1); mark(); }

}

const escH = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function mdHtml(src) {
  const out = [];
  let list = null, code = null;
  const flush = () => { if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; } };
  for (const line of String(src).split('\n')) {
    if (/^\s*```/.test(line)) { if (code) { out.push(`<pre><code>${escH(code.join('\n'))}</code></pre>`); code = null; } else { flush(); code = []; } continue; }
    if (code) { code.push(line); continue; }
    const li = line.match(/^\s*[-*] (.*)$/);
    if (li) { (list = list || []).push(`<li>${mdInline(li[1])}</li>`); continue; }
    flush();
    const hd = line.match(/^#{1,6}\s+(.*)$/);
    if (hd) out.push(`<p><strong>${mdInline(hd[1])}</strong></p>`);
    else if (line.trim()) out.push(`<p>${mdInline(line)}</p>`);
  }
  flush();
  if (code) out.push(`<pre><code>${escH(code.join('\n'))}</code></pre>`);
  return out.join('');
}

  // The parts of the card. Which column each belongs to is fixed (PANE_SECS); the order inside a column is the user's (paneLayout).
  const secs = {};
  secs.conv = { title: d.feed ? '会話' : '直近のやりとり', nodes: d.feed ? [renderFeed(d, p)] : msgs,

  if (d.feed) secs.progress = { nodes: [renderSignals(s.signals, d.git)] };
  secs.send = { nodes: [renderDispatch(d)] };
  secs.labels = { nodes: [labelWrap] };
  secs.memo = { nodes: [note] };
  secs.detail = { nodes: [h('dl', { class: 'kv' },
    ...kv('AI App', s.agent === 'codex' ? 'Codex' : 'Claude Code'),
    ...kv('マシン', s.host ? `${s.host.label}（SSH: ${s.host.alias}）` : 'このマシン'),
    ...accountKv(s),

  )] };
  if (d.pr) secs.pr = { title: d.pr.provider === 'gitlab' ? 'マージリクエスト' : 'プルリクエスト', extra: prPill(d.pr), nodes: [h('div', { class: 'msg' },
    h('button', { class: 'link-btn', text: `${d.pr.title}`, onclick: () => bridge.openLink(d.pr.url).catch(() => copyText(d.pr.url, 'PR の URL')) }),
    h('div', { class: 'muted', text: `${String(d.repo).replace(/^gitlab:/, 'GitLab: ')} · ${d.pr.branch}` }),
    ...(d.pr.checkRuns || []).map((c) => h('div', { class: 'check-row' }, h('span', { class: `ck ck-${/fail|error|cancel|timed/.test(c.state) ? 'failing' : /success|pass|neutral|skipped/.test(c.state) ? 'passing' : 'pending'}`, text: /fail|error|cancel|timed/.test(c.state) ? '✗' : /success|pass|neutral|skipped/.test(c.state) ? '✓' : '●' }), ` ${c.name}`)))] };
  if (related.length) secs.related = { nodes: related };
  secs.first = { nodes: [h('div', { class: 'msg user', text: s.preview || '-' })] };
  secs.resume = { nodes: [resumeBox] };
  secs.task = { nodes: [taskSel] };
  secs.add = { nodes: [h('button', { class: 'side-btn', text: '🏷 ラベル', title: 'ボード上では l キー', onclick: (e) => labelPicker(e.currentTarget, s.id, card, paintLabels) }), dirBtn] };
  secs.prio = { nodes: [prio, due] };
  secs.other = { nodes: [
    s.prUrl ? h('button', { class: 'side-btn', text: '↗ PR を開く', onclick: () => bridge.openLink(s.prUrl).catch(() => copyText(s.prUrl, 'PR URL')) }) : null,
    h('button', { class: 'side-btn', text: '⧉ セッション ID をコピー', onclick: () => copyText(s.nativeId, 'セッション ID') }),
    s.sourcePath ? h('button', { class: 'side-btn', text: '⧉ ログのパスをコピー', onclick: () => copyText(s.sourcePath, 'パス') }) : null,
    h('button', { class: 'side-btn', text: card.hidden ? '👁 ボードに再表示' : '🙈 ボードから隠す',
      onclick: async () => { await act('canban_update_card', { cardId: s.id, hidden: !card.hidden }, { okMsg: card.hidden ? '再表示しました' : '隠しました' }); closeCards(); } }),
  ].filter(Boolean) };

  const cols = { main: h('div', { class: 'pcol', 'data-col': 'main' }), side: h('div', { class: 'pcol', 'data-col': 'side' }) };
  for (const id of Object.keys(PANE_SECS)) {

  }
  const scroll = ['main', 'side'].map((c) => $(`.pcol[data-col="${c}"]`, el)?.scrollTop ?? 0);
  p.status = s.status || 'idle';

  el.replaceChildren(
    h('div', { class: 'pane-h' }, top,

        h('span', { class: 'row pane-status', style: { gap: '0' } }, h('span', { class: `sdot s-${p.status}` }), STATUS_LABELS[p.status]),
        'リスト:', listSel, h('span', { class: 'pill viewer-pill viewers', hidden: true }))),
    h('div', { class: 'pane-b' }, cols.main, columnSplit('session'), cols.side), paneWidthHandle('session'));
  applyPaneLayoutTo(el);
  cols.main.scrollTop = scroll[0];
  cols.side.scrollTop = scroll[1];
  const prog = $('[data-sec="progress"]', el);
  if (prog && $('.sig-box', prog)?.hidden) $('.psec-b', prog).append(h('span', { class: 'muted empty-progress', text: 'なし' }));
  paintPaneButtons(p);
  applyPaneAttrs(p);
  paintViewers(p);
  if (d.feed) scrollFeedToEnd(live.feeds.get(s.id));
  if (!live.on) watchRequests(el, d);
  workspace.trackDrafts(el);
}

// ======================================================================
// Requests: sending prompts to a session (one headless turn each)
// ======================================================================
const REQ_ICONS = { queued: '⏳', starting: '▶', running: '▶', succeeded: '✓', failed: '✗', cancelled: '⊘', interrupted:'⏹',blocked:'⏸' };
const REQ_LABELS = { queued: '待機中', starting: '開始中', running: '実行中', succeeded: '完了', failed: '失敗', cancelled: '取り消し', interrupted:'停止',blocked:'競合のため停止' };

function requestPill(r) {
  if (r.running) return h('span', { class: 'pill', title: 'Canban から送った指示を実行中', text: `▶ 実行中${r.queued ? `・待機 ${r.queued}` : ''}` });
  if (r.paused) return h('span', { class: 'pill due-over', title: 'キューが一時停止しています（詳細で再開）', text: `⏸ 待機 ${r.queued}` });
  return h('span', { class: 'pill', title: 'セッションが空いたら順に送ります', text: `📨 ${r.queued}` });
}

function keepDisabledPrompt(box, value) {
  if (!box) return;
  const input = h('textarea', { 'aria-label': '送るプロンプト', readonly: true });
  workspace.draftValues.set(input, ''); input.value = value; box.append(input);
}
function replaceDispatch(old, d) {
  if (old.querySelector('.req-row textarea, .prompt-skill-picker:not([hidden]), .prompt-composer[aria-busy="true"]')) return;
  const draft = old.querySelector('textarea[aria-label="送るプロンプト"]')?.value || '';
  const stored = promptDrafts.get(`dispatch:${d.session.id}`);
  if (stored) stored.text = draft;
  const next = renderDispatch(d), input = next.querySelector('.send-box textarea');
  if (input) { workspace.trackDrafts(next); input.value = draft; }
  // If sending has been disabled, retain the draft next to the reason.
  else if (draft) keepDisabledPrompt(next, draft);
  old.replaceWith(next);
}
function renderDispatch(d) {
  const s = d.session;
  const D = d.dispatch;
  const box = h('div', { class: 'send-section' });
  const title = h('div', { class: 'section-title', text: '指示を送る' });
  if (!D.settings.enabled) {
    box.append(title, h('div', { class: 'muted', text: '指示の送信は設定でオフになっています（⚙ 設定）。' }));
    return box;
  }
  const p = D.permission;
  const permChip = p
    ? h('span', { class: `perm-chip${p.elevated ? ' elevated' : ''}`, title: `このセッションの設定を引き継ぎます（${p.source === 'session' ? 'セッションの記録' : p.source === 'database' ? 'Codex の DB' : '読み取れないため最も制限的な設定'}）`,
      text: `${p.elevated ? '⚠ 制限なし: ' : '🔒 '}${p.label}` })
    : h('span', { class: 'perm-chip', text: s.host ? '🔒 権限は送信時にリモートで確認します' : '🔒 権限を確認できません' });
  const ta = h('textarea', { placeholder: 'このセッションに送るプロンプト（⌘/Ctrl + Enter で今すぐ送信）', 'aria-label': '送るプロンプト' });
  const ack = p?.elevated ? h('input', { type: 'checkbox', 'aria-label': '制限なしで実行されることを確認しました' }) : null;
  const busy = s.status === 'running' || s.status === 'waiting' || !!s.codexFollowUps;
  const composer = promptComposer(ta, { key: `dispatch:${s.id}`, context: () => ({ cardId: s.id }), submit: () => send('now') });
  const sendButtons = [];
  const send = async (when) => {
    const prompt = ta.value.trim();
    if (!composer.hasContent()) return ta.focus();
    if (composer.draft.sending) return;
    try {
      const payload = composer.payload();
      composer.setSending(true); sendButtons.forEach(b => { b.disabled = true; });
      await bridge.callTool('canban_dispatch', { cardId: s.id, prompt, ...payload, when, expectedUpdatedAt: s.updatedAt || null, allowElevated: !!ack?.checked });
      composer.clear();
      toast(when === 'now' ? '送信しました' : 'キューに追加しました');
      openCard(s.id);
      load();
    } catch (e) {
      if (e.code === 'elevated') { toast(e.message, true); ack?.focus(); return; }
      if (e.code === 'conflict') { toast(e.message,true); return; }
      if (e.code === 'busy') return toast(`${e.message}。入力は保持しています。状態を確認してから再操作してください。`,true);
      toast(e.message, true);
    } finally {
      composer.setSending(false); sendButtons.forEach(b => { b.disabled = busy; });
    }
  };
  sendButtons.push(h('button', { class: 'btn-primary', disabled: busy, text: '▶ 今すぐ送信', onclick: () => send('now') }),
    h('button', { class:'side-btn',disabled:busy,style:{width:'auto',marginBottom:0},text:'＋ キューに追加', onclick: () => send('queue') }));
  const appNote = s.agent === 'codex' || s.desktopSessionId || s.entrypoint === 'claude-desktop'
    ? helpTip(`${s.agent === 'codex' ? 'Codex' : 'Claude'} アプリでこのセッションを開いている場合は、閉じてから送ってください（アプリ側の表示と履歴がずれることがあります）。`) : null;
  box.append(...[title,
    D.paused ? h('div', { class: 'paused-bar' }, h('span', { class: 'grow', text: `⏸ キュー一時停止: ${D.paused.reason}` }),
      h('button', { class: 'link-btn', text: '再開', onclick: () => act('canban_resume_queue', { cardId: s.id }, { okMsg: 'キューを再開しました' }).then(() => openCard(s.id)) })) : null,
    h('div', { class: 'send-box' },
      h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap', marginBottom: '6px' } }, permChip),
      composer.root,
      ack ? h('label', { class: 'send-note row', style: { gap: '6px' } }, ack, 'このセッションはサンドボックス／確認なしで動いています。そのまま実行されることを確認しました') : null,
      busy ? h('div', { class: 'muted', style: { marginTop: '6px' }, text: s.codexFollowUps
        ? `Codex アプリのキューにフォローアップが ${s.codexFollowUps} 件あります。二重に送らないよう、アプリ側で送るか消すまで Canban からは送りません。`
        : `セッションが${s.status === 'running' ? '実行中' : '入力待ち'}のため、今すぐは送れません。入力を保持します。状態を確認してから再操作してください。` }) : null,
      h('div', { class: 'send-actions' },
        ...sendButtons,
        helpTip('1 ターンずつ公式 CLI で実行します')),
      appNote),
    ...D.active.map((r) => requestRow(s, r)),
    D.queue.length ? h('div', { class: 'field-label', text: `キュー（${D.queue.length}）` }) : null,
    ...D.queue.map((r, i) => requestRow(s, r, { index: i, queue: D.queue })),
    D.history.length ? h('div', { class: 'field-label', text: '履歴' }) : null,
    ...D.history.map((r) => requestRow(s,r,{review:() => { try { composer.restore(r); toast('実行状況を確認し、内容を確認してから送信してください。'); } catch(e) { toast(e.message, true); } }})),
  ].filter(Boolean));
  return box;
}

function requestRow(s,r,{index=-1,queue=[],review=null}={}) {
  const who = r.origin === 'model' ? '🤖 ' : '';
  const when = r.endedAt ? `${relTime(r.endedAt)}${r.startedAt ? `・${Math.max(1, Math.round((r.endedAt - r.startedAt) / 1000))} 秒` : ''}` : r.startedAt ? `${relTime(r.startedAt)}から` : relTime(r.createdAt);
  const btns = h('div', { class: 'req-btns' });
  const refresh = () => openCard(s.id);
  if (r.state === 'queued') {
    const move = (dir) => {
      const other = queue[index + dir];
      if (!other) return;
      const order = dir < 0 ? (queue[index - 2] ? (queue[index - 2].order + other.order) / 2 : other.order - 1000) : (queue[index + 2] ? (queue[index + 2].order + other.order) / 2 : other.order + 1000);
      act('canban_update_request', { requestId: r.id, order }, { reload: false }).then(refresh);
    };
    btns.append(...[
      index > 0 ? h('button', { title: '前へ', 'aria-label': '前へ', text: '↑', onclick: () => move(-1) }) : null,
      index < queue.length - 1 ? h('button', { title: '後ろへ', 'aria-label': '後ろへ', text: '↓', onclick: () => move(1) }) : null,
      h('button', { text: '編集', onclick: (e) => editRequest(e.currentTarget.closest('.req-row'), r, refresh) }),
      h('button', { text: '取消', onclick: () => act('canban_cancel_request', { requestId: r.id }, { okMsg: '取り消しました' }).then(refresh) })].filter(Boolean));
  } else if (r.state === 'running' || r.state === 'starting') {
    btns.append(h('button', { text: '⏹ 停止', onclick: () => act('canban_stop_request', { requestId: r.id }, { okMsg: '停止を送りました' }).then(refresh) }));
  }
  if (review && ['blocked','interrupted','failed'].includes(r.state)) btns.append(h('button',{text:'再送内容を確認',onclick:review}));
  if (r.logPath) btns.append(h('button', { title: '実行ログのパスをコピー', text: '⧉ ログ', onclick: () => copyText(r.logPath, 'ログのパス') }));
  const result = r.resultText || r.error;
  return h('div', { class: 'req-row' },
    h('span', { class: `req-state ${r.state}`, title: REQ_LABELS[r.state], text: REQ_ICONS[r.state] || '•' }),
    h('div', { class: 'grow' },
      h('div', { class: 'req-prompt', text: r.prompt }),
      r.images?.length || r.skills?.length ? h('div', { class: 'muted', text: [...(r.images || []).map(i => `画像: ${i.name}`), ...(r.skills || []).map(s => `$${s.name}`)].join(' / ') }) : null,
      h('div', { class: 'muted', text: `${who}${REQ_LABELS[r.state]}・${when}${r.state === 'queued' && r.blockedReason ? `・${r.blockedReason}` : ''}` }),
      result ? h('details', {}, h('summary', { text: r.error ? `エラー: ${r.error.split('\n')[0].slice(0, 80)}` : `結果: ${r.resultText.split('\n')[0].slice(0, 80)}` }), h('div', { class: 'msg', text: result })) : null),
    btns);
}

function editRequest(row, r, done) {
  const ta = h('textarea', { 'aria-label': 'プロンプトを編集' });
  ta.value = r.prompt;
  const save = () => act('canban_update_request', { requestId: r.id, prompt: ta.value }, { reload: false, okMsg: '保存しました' }).then(done);
  row.replaceChildren(h('div', { class: 'send-box grow' }, ta, h('div', { class: 'send-actions' },
    h('button', { class: 'btn-primary', text: '保存', onclick: save }), h('button', { class: 'link-btn', text: 'キャンセル', onclick: done }))));
  ta.focus();
}

// While a request is queued or running, refresh the section every few seconds.
function watchRequests(modal, d) {
  clearInterval(modal._reqTimer);
  if (!d.dispatch.active.length && !d.dispatch.queue.length) return;
  modal._reqTimer = setInterval(async () => {
    if (!document.body.contains(modal) || workspace.hasDrafts(modal) || modal.querySelector('.send-box textarea:focus, .req-row textarea')) {
      if (!document.body.contains(modal)) clearInterval(modal._reqTimer);
      return;
    }
    try {
      const res = await bridge.callTool('canban_list_requests', { cardId: d.session.id, limit: 30 });
      const sig = (list) => list.map((r) => `${r.id}:${r.state}`).join(',');
      const cur = [...d.dispatch.active, ...d.dispatch.queue, ...d.dispatch.history];
      if (sig(res.requests.slice().sort((a, b) => a.id.localeCompare(b.id))) !== sig(cur.slice().sort((a, b) => a.id.localeCompare(b.id)))) {
        clearInterval(modal._reqTimer);
        openCard(d.session.id);
        load();
      }
    } catch {}
  }, 4000);
}

// ======================================================================
// Realtime: the live session feed and the board's long poll (canban_watch)
// ======================================================================
const TOOL_ICONS = { ok: '✓', error: '✗' };
const fmtClock = (at) => (at ? new Date(at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '');

function feedItem(it, f) {
  if (it.k === 'user') return h('div', { class: 'fi fi-user', title: fmtDate(Date.parse(it.at)), text: it.text });
  if (it.k === 'assistant') return h('div', { class: 'fi fi-asst' }, h('span', { class: 'raw', text: it.text }), h('div', { class: 'md', html: mdHtml(it.text) }));
  if (it.k === 'commentary') return h('div', { class: 'fi fi-note', text: it.text });
  if (it.k === 'thinking') {
    if (!it.text) return null;
    return h('details', { class: 'fi fi-think' }, h('summary', {}, h('span', { class: 'ti', text: '💭' }), h('span', { text: '考えた内容' })), h('div', { class: 'tt', text: it.text }));
  }
  if (it.k === 'tool') {
    const icon = h('span', { class: `ti ${it.state}`, text: TOOL_ICONS[it.state] || '' });
    const out = h('pre', { text: it.out || '' });
    if (!it.out) out.hidden = true;
    const el = h('details', { class: 'fi fi-tool' }, h('summary', { title: it.summary }, icon, h('span', { class: 'tn', text: it.name }), h('span', { class: 'ts', text: it.summary })), out);
    if (it.id) f.tools.set(it.id, { el, icon, out });
    return el;
  }
  if (it.k === 'turn') return h('div', { class: 'fi-turn', text: `${it.state === 'aborted' ? '⏹ 中断しました' : '— ターン完了'}${it.at ? ` · ${fmtClock(it.at)}` : ''}` });
  return null;
}

function renderFeed(d, p) {
  const list = h('div', { class: 'feed', role: 'log', 'aria-live': 'polite', 'aria-label': 'セッションの会話' });
  const foot = h('div', { class: 'feed-foot' });
  const newBtn = h('button', { class: 'feed-new', text: '↓ 新着', hidden: true, onclick: () => scrollFeedToEnd(f) });
  const f = { pane: p, cardId: d.session.id, offset: d.feed.offset, size: d.feed.size, codexItems: d.feed.codexItems, list, foot, newBtn, tools: new Map(), status: d.session.status || 'idle', activity: d.session.activity || null, signals: d.session.signals || null, git: d.git || null };
  list.addEventListener('scroll', () => { if (atFeedEnd(list)) newBtn.hidden = true; });
  for (const it of d.feed.items) { const el = feedItem(it, f); if (el) list.append(el); }
  const lastSaid = [...d.feed.items].reverse().find((it) => it.k === 'assistant');
  p.lastText = lastSaid ? lastSaid.text : d.session.preview || '';
  if (!d.feed.items.length) list.append(h('div', { class: 'muted', text: 'まだやりとりはありません' }));
  live.feeds.set(f.cardId, f);
  paintFeedFoot(f);
  kickLive();
  return h('div', { class: 'feed-wrap' }, list, newBtn, foot);
}

// ---- the long poll ----
const live = { on: false, seq: null, feeds: new Map(), mode: 'long', inflight: 0, lastLoad: 0, loadTimer: null, dirty: false, ownActAt: 0, lastWatchEnd: 0, presence: [], viewers: new Map() };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const liveIdle = () => !state.drag && !document.querySelector('.popover, .list-title-input, .composer');

// Rebuild the board soon (coalesced, at most once every 1.5 s), when nothing is being edited.
function scheduleLoad(delay = 0) {
  if (state.view === 'analytics') return;
  // Our own change reloads in act(); the echo of it is picked up after that, not twice at once.
  const wait = Math.max(delay, 1500 - (Date.now() - live.lastLoad), 1500 - (Date.now() - live.ownActAt));
  clearTimeout(live.loadTimer);
  live.loadTimer = setTimeout(() => {
    if (!liveIdle() || document.visibilityState !== 'visible') { live.dirty = true; return; }
    live.dirty = false;
    live.lastLoad = Date.now();
    load();
  }, Math.max(0, wait));
}

function findCard(id) {
  for (const l of state.board?.lists || []) for (const c of l.cards) {
    if (c.id === id) return { card: c, list: l };
    if (c.kind === 'task' && c.links?.some((x) => x.id === id)) return { card: c, list: l, link: c.links.find((x) => x.id === id) };
  }
  return null;
}

// Patch cards in place: a status change rebuilds the board (rules and counts follow it).
function applyPatches(patches) {
  let rebuild = false;
  for (const p of patches) {
    const hit = findCard(p.id);
    if (!hit) continue;
    const { card, list, link } = hit;
    if (link) { if (link.status !== p.status) rebuild = true; continue; }
    if (card.status !== p.status) { rebuild = true; continue; }
    const openHere = live.feeds.has(p.id);
    if ((p.updatedAt || 0) > (card.updatedAt || 0) && !openHere) card.unread = true;
    card.updatedAt = Math.max(card.updatedAt || 0, p.updatedAt || 0);
    card.activity = p.activity;
    card.signals = p.signals || null;
    card.git = p.git || null;
    const el = document.querySelector(`.card[data-card-id="${CSS.escape(p.id)}"]`);
    if (el && !state.drag) {
      const focused = el.contains(document.activeElement);
      const next = renderCard(card, list);
      el.replaceWith(next);
      if (focused) next.focus();
    }
  }
  if (rebuild) scheduleLoad();
}

async function refreshDispatch(f) {
  const el = f?.pane.el;
  if (!el || el.querySelector('.send-box textarea:focus, .req-row textarea')) return;
  try {
    const d = await bridge.callTool('canban_get_session', { cardId: f.cardId, messages: 1 });
    const old = el.querySelector('.send-section');
    if (old && live.feeds.get(f.cardId) === f) replaceDispatch(old, d);
  } catch {}
}

// Other live boards (Codex / Claude Desktop) and the cards they have open.
function applyPresence(list) {
  const key = JSON.stringify(list || []);
  if (key === JSON.stringify(live.presence)) return;
  const before = live.viewers;
  live.presence = list || [];
  live.viewers = new Map();
  for (const p of live.presence) if (p.cardId) live.viewers.set(p.cardId, [...new Set([...(live.viewers.get(p.cardId) || []), p.app])]);
  const bar = $('#presenceBar');
  const apps = [...new Set(live.presence.map((p) => p.app))];
  bar.hidden = !apps.length;
  bar.title = live.presence.map((p) => `${p.app}: ${p.cardId ? `「${findCard(p.cardId)?.card.title ?? p.cardId}」を表示中` : 'ボードを表示中'}`).join('\n');
  bar.replaceChildren(h('span', { text: `👁 ${apps.join('・')}` }));
  for (const id of new Set([...before.keys(), ...live.viewers.keys()])) {
    if (JSON.stringify(before.get(id)) === JSON.stringify(live.viewers.get(id))) continue;
    const hit = findCard(id);
    const el = document.querySelector(`.card[data-card-id="${CSS.escape(id)}"]`);
    if (hit && !hit.link && el && !state.drag) {
      const focused = el.contains(document.activeElement);
      const next = renderCard(hit.card, hit.list);
      el.replaceWith(next);
      if (focused) next.focus();
    }
  }
  panes.forEach(paintViewers);
}

function applyLive(r, args) {
  if (r.presence) applyPresence(r.presence);
  if (r.seq != null) live.seq = live.seq == null ? r.seq : Math.max(live.seq, r.seq);
  if (r.patches?.length) applyPatches(r.patches);
  applyAccountLimits(r.accountLimits);
  if (r.reload) scheduleLoad();
  if (r.requests) { for (const f of live.feeds.values()) refreshDispatch(f); scheduleLoad(); }
  for (const [id, feed] of Object.entries(r.feeds || {})) {
    const f = live.feeds.get(id);
    const sent = args.feeds?.find((x) => x.cardId === id);
    if (f && sent && f.offset === sent.offset) applyFeed(f, feed);
  }
}

function watchArgs(timeoutMs) {
  const args = { since: live.seq, timeoutMs };
  if (live.feeds.size) args.feeds = [...live.feeds.values()].map((f) => ({ cardId: f.cardId, offset: f.offset, size: f.size ?? null, codexItems: !!f.codexItems }));
  return args;
}

async function watchOnce(timeoutMs) {
  const args = watchArgs(timeoutMs);
  live.inflight++;
  try {
    const r = await bridge.callTool('canban_watch', args);
    if (r?.off) { live.on = false; return false; }
    applyLive(r, args);
    return true;
  } finally {
    live.inflight--;
    live.lastWatchEnd = performance.now();
  }
}

// The detail view opened or changed: tell the server now instead of after the pending wait.
function kickLive() {
  if (live.on && live.seq != null) watchOnce(0).catch(() => {});
}

// Unknown hosts may serialize calls. Native Messaging multiplexes them, so a slow
// normal response near a watch completion is not evidence of serialization there.
function noteCall(name, startedAt, pendingAtStart, concurrent) {
  if (concurrent || name === 'canban_watch' || !pendingAtStart || live.mode !== 'long') return;
  const now = performance.now();
  if (now - startedAt > 1500 && now - live.lastWatchEnd < 80) {
    live.mode = 'short';
    console.info('canban: using short polling to keep tool calls responsive');
  }
}

bridge.hooks.pending = () => live.inflight > 0;
bridge.hooks.after = noteCall;

async function liveLoop() {
  let failures = 0;
  for (;;) {
    if (document.visibilityState !== 'visible') {
      await new Promise((r) => document.addEventListener('visibilitychange', r, { once: true }));
      continue;
    }
    if (live.dirty && liveIdle()) scheduleLoad();
    try {
      const first = live.seq == null;
      if (!(await watchOnce(first ? 0 : live.mode === 'long' ? 20000 : 0))) return;
      failures = 0;
      if (live.mode === 'short') await sleep(2500);
    } catch (e) {
      failures++;
      if (failures >= 3 && live.mode === 'long') live.mode = 'short'; // e.g. a host timeout shorter than the wait
      await sleep(Math.min(30000, 1000 * 2 ** failures));
    }
  }
}

function hasLive(b) { return (b.statusCounts?.running || 0) + (b.statusCounts?.waiting || 0) > 0; }

const announced = new Set();
function announceAutoMoves(b) {
  for (const m of b.recentAutoMoves || []) {
    const key = `${m.cardId}@${m.at}`;
    if (announced.has(key)) continue;
    announced.add(key);
    if (Date.now() - m.at > 90e3) continue; // only fresh moves get a toast
    const list = b.lists.find((l) => l.id === m.toListId);
    toastAction(`⚡「${m.title}」を「${list?.title ?? m.toListId}」へ移動しました`, '元に戻す', () =>

function toastAction(msg, label, fn) {

    h('button', { class: 'toast-btn', text: label, onclick: () => { t.remove(); fn(); } }));

const runningRules = new Set();
async function runRuleNow(ruleId) {
  if (runningRules.has(ruleId)) return;
  const updateButtons = (busy) => {
    for (const button of document.querySelectorAll('[data-run-rule]')) {
      if (button.dataset.runRule !== ruleId) continue;
      button.disabled = busy;
      button.textContent = busy ? '実行中…' : '今すぐ実行';
      button.setAttribute('aria-busy', String(busy));
    }
  };
  runningRules.add(ruleId);
  updateButtons(true);
  try {
    const { result } = await act('canban_run_rule', { ruleId });
    toast(`${result.moved} 件のカードを移動しました${result.errors?.length ? '（一部のセッションを取得できませんでした）' : ''}`);
  } catch {
    // act already displays the server error and refreshes the board.
  } finally {
    runningRules.delete(ruleId);
    updateButtons(false);
  }
}

// ======================================================================
// Drag & drop (pointer events; works inside sandboxed iframes)
// ======================================================================
function startCardDrag(e, card, el) {
  if (e.button !== 0 || e.target.closest('.labels')) return;
  const sx = e.clientX, sy = e.clientY;
  const rect = el.getBoundingClientRect();
  let started = false;
  const move = (ev) => {
    if (!started) {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
      started = true;
      const ghost = el.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = `${rect.width}px`;
      document.body.append(ghost);
      const ph = h('div', { class: 'placeholder', style: { height: `${rect.height}px` } });
      el.after(ph);
      el.classList.add('drag-source');
      el.style.display = 'none';
      state.drag = { type: 'card', card, el, ghost, ph, dx: sx - rect.left, dy: sy - rect.top, fromList: el.closest('.cards').dataset.listId };
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    ev.preventDefault();
    const d = state.drag;
    d.ghost.style.left = `${ev.clientX - d.dx}px`;
    d.ghost.style.top = `${ev.clientY - d.dy}px`;
    // Dropping a session card onto the middle of a task card links it to the task;
    // near a card's edges it is a normal move. Decide before moving the placeholder.
    // Dropping onto a directory in the sidebar changes the card's directory.
    d.ph.style.display = 'none';
    const dirEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.side-dir');
    d.ph.style.display = '';
    if (d.dropDir !== dirEl) {
      d.dropDir?.classList.remove('drop-target');
      d.dropDir = dirEl;
      d.dropDir?.classList.add('drop-target');
    }
    if (dirEl) { d.ph.style.display = 'none'; return; }
    let under = null;
    if (card.kind !== 'task') {
      d.ph.style.display = 'none';
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card.task');
      if (t) {
        const r = t.getBoundingClientRect();
        if (ev.clientY > r.top + r.height * 0.2 && ev.clientY < r.bottom - r.height * 0.2) under = t;
      }
    }
    if (d.dropTask !== under) {
      d.dropTask?.classList.remove('drop-target');
      d.dropTask = under;
      d.dropTask?.classList.add('drop-target');
    }
    d.ph.style.display = d.dropTask ? 'none' : '';
    if (!d.dropTask) placeCardPlaceholder(ev.clientX, ev.clientY);
    autoScroll(ev.clientX, ev.clientY);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    stopAutoScroll();
    if (!started) return;
    const d = state.drag;
    const cardsEl = d.ph.parentElement;
    const toList = cardsEl?.dataset.listId;
    // Index in the full list from the placeholder's neighbours (works with swimlanes too).
    let idx = -1;
    if (cardsEl) {
      const rest = state.board.lists.find((l) => l.id === toList).cards.filter((c) => c.id !== card.id);
      const near = (dir) => { let n = d.ph[dir]; while (n && (!n.classList.contains('card') || n.classList.contains('drag-source'))) n = n[dir]; return n; };
      const next = near('nextElementSibling');
      const prev = near('previousElementSibling');
      if (next) idx = rest.findIndex((c) => c.id === next.dataset.cardId);
      else if (prev) idx = rest.findIndex((c) => c.id === prev.dataset.cardId) + 1;
      else idx = rest.length;
      if (idx < 0) idx = rest.length;
    }
    d.ghost.remove();
    state.drag = null;
    state.justDragged = true;
    setTimeout(() => (state.justDragged = false), 0);
    if (d.dropDir) {
      const dir = d.dropDir.dataset.dirId;
      d.dropDir.classList.remove('drop-target');
      act('canban_update_card', { cardId: card.id, directory: dir }, { okMsg: dir === '__none' ? `${T.category}から外しました` : `📂 ${state.board.directories.find((x) => x.id === dir)?.name ?? ''} に入れました` }).catch(() => {});
      return;
    }
    // Directory swimlanes: dropping into another lane also moves the card to that directory.
    const laneDir = state.filters.swimlane === 'directory' ? cardsEl?.closest('.lane')?.dataset.dirId : null;
    let dirDone = null;
    if (laneDir && laneDir !== (card.directory?.id || '__none')) {
      dirDone = bridge.callTool('canban_update_card', { cardId: card.id, directory: laneDir }).catch((e) => toast(e.message, true));
      card.directory = state.board.directories.find((x) => x.id === laneDir) || null;
    }
    if (d.dropTask) {
      const taskId = d.dropTask.dataset.cardId;
      d.dropTask.classList.remove('drop-target');
      act('canban_link_session', { taskId, sessionId: card.id }, { okMsg: `${T.taskCard}に紐付けました` }).catch(() => {});
      return;
    }
