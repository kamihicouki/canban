<body>
<header class="topbar appbar" role="toolbar" aria-label="アプリバー">
  <button id="sideBtn" class="hbtn icon-only" title="ワークスペースサイドバー（b）" aria-label="ワークスペースサイドバー" aria-pressed="true" data-icon="sidebar"></button>
  <span id="brand" class="brand" title="Canban"><span class="brand-word">canban</span></span>
  <h1 class="board-name"><button id="logo" type="button" aria-haspopup="listbox" title="表示するカテゴリを選ぶ（p）">すべてのセッション</button></h1>
  <div id="viewSwitch" class="view-switch" role="group" aria-label="表示" data-pri="3"></div>
  <label class="hsearch-wrap" data-icon="search" data-icon-size="16">
    <input id="q" class="hsearch" type="search" placeholder="検索・コマンド" aria-label="検索" aria-keyshortcuts="/" />
    <span class="hsearch-keys" aria-hidden="true"><kbd class="keycap">/</kbd><kbd class="keycap">⌘K</kbd></span>
  </label>
  <label class="ft-toggle" data-pri="2" title="会話の本文も検索する（3 文字以上）"><input id="fulltext" type="checkbox" /> 本文</label>
  <button id="quickTaskBtn" class="hbtn primary quick-task-trigger" type="button" aria-label="タスクを作成" title="タスクを作成（c）" data-icon="plus"><span class="lbl">作成 <kbd class="keycap">c</kbd></span></button>
  <div id="filterChips" class="filter-chips" role="group" aria-label="有効な絞り込み" data-pri="7"></div>
  <span class="spacer"></span>
  <button id="moreBtn" class="hbtn icon-only" aria-haspopup="true" title="その他" aria-label="その他" data-icon="more" hidden></button>
  <span class="bar-sep" aria-hidden="true"></span>
  <span id="presenceBar" class="limits presence" hidden></span>
  <span id="statusBar" class="status-bar" role="group" aria-label="実行状態" data-pri="8"></span>
  <button id="seenBtn" class="hbtn" data-pri="5" title="新着をすべて既読にする" data-icon="check" hidden><span class="lbl">既読</span></button>
  <button id="perfBtn" class="hbtn" data-pri="6" title="Canban 自身の処理が予算を超えました（クリックで詳細）" aria-label="処理時間の警告" data-icon="alert" hidden></button>
  <button id="accountsBtn" class="hbtn acct-btn" aria-haspopup="dialog" aria-label="アカウントと使用量" title="アカウント・使用量・設定フォルダ"><span id="acctRings" class="rings"></span><span class="ic"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><!-- Lucide UsersRound, ISC --><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg></span><span class="lbl acct-lbl"></span><span class="caret">▾</span></button>
  <button id="refresh" class="hbtn icon-only" data-pri="4" title="再読み込み（r）" aria-label="再読み込み" data-icon="refresh"></button>
</header>
<div id="errbar" class="errbar" hidden></div>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="レーン・カテゴリ" hidden></aside>
  <div class="stage">
    <div id="ribbon" class="time-ribbon" role="region" aria-label="時間の帯"></div>
    <main id="board" class="board" aria-label="カンバンボード"><div class="loading">読み込み中…</div></main>
  </div>
</div>

<script>
// Display names of Canban's own concepts, kept apart from the agents' terms
// (docs: README「用語」). Change a word here to rename it everywhere in the UI.
const T = { category: 'カテゴリ', automation: '自動化', taskCard: 'タスクカード', aiApps: 'AI Apps', folder: 'フォルダ' };
{
  const set = (sel, attr, v) => { const el = document.querySelector(sel); if (el) (attr === 'text' ? (el.textContent = v) : el.setAttribute(attr, v)); };
  set('#logo', 'title', `表示する${T.category}を選ぶ（p）`);
  set('#sidebar', 'aria-label', `レーン・${T.category}`);
}
