<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canban</title>
<style>
:root {
  --board-bg: #0079bf;
  --board-bg-2: #5067c5;
  --header-bg: rgba(0, 0, 0, 0.24);
  --header-fg: #fff;
  --list-bg: #f1f2f4;
  --list-fg: #172b4d;
  --list-muted: #44546f;
  --card-bg: #fff;
  --card-fg: #172b4d;
  --card-muted: #626f86;
  --card-shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f;
  --card-hover: #f7f8f9;
  --input-bg: #fff;
  --input-border: #8590a2;
  --btn-subtle: rgba(9, 30, 66, 0.06);
  --btn-subtle-hover: rgba(9, 30, 66, 0.14);
  --modal-bg: #f1f2f4;
  --modal-panel: #fff;
  --overlay: rgba(0, 0, 0, 0.64);
  --accent: #0c66e4;
  --danger: #c9372c;
  --warn-bg: #ffecb3;
  --warn-fg: #7f5f01;
  --focus: #388bff;
  --codex: #12a381;
  --claude: #d46f4c;
  --c-gray: #8590a2; --c-blue: #579dff; --c-green: #4bce97; --c-yellow: #f5cd47; --c-orange: #fea362;
  --c-red: #f87168; --c-purple: #9f8fef; --c-pink: #e774bb; --c-sky: #6cc3e0; --c-lime: #94c748;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --board-bg: #1d2125;
  --board-bg-2: #0b2a4a;
  --header-bg: rgba(0, 0, 0, 0.35);
  --list-bg: #101204;
  --list-fg: #b6c2cf;
  --list-muted: #8c9bab;
  --card-bg: #22272b;
  --card-fg: #b6c2cf;
  --card-muted: #8c9bab;
  --card-shadow: 0 1px 1px #03040480, 0 0 1px #03040480;
  --card-hover: #2c333a;
  --input-bg: #22272b;
  --input-border: #738496;
  --btn-subtle: rgba(161, 189, 217, 0.08);
  --btn-subtle-hover: rgba(166, 197, 226, 0.16);
  --modal-bg: #323940;
  --modal-panel: #282e33;
  --overlay: rgba(0, 0, 0, 0.72);
  --accent: #579dff;
  --danger: #f87168;
  --warn-bg: #533f04;
  --warn-fg: #f5cd47;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: linear-gradient(135deg, var(--board-bg), var(--board-bg-2));
  color: var(--list-fg);
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- header ---------- */
.topbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--header-bg); color: var(--header-fg);
  backdrop-filter: blur(6px);
}
.topbar h1 { font-size: 18px; margin: 0 8px 0 4px; font-weight: 700; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.hbtn, .hselect, .hsearch {
  height: 32px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #fff; border: 0; padding: 0 10px;
}
.hbtn:hover, .hselect:hover { background: rgba(255,255,255,0.3); }
.hbtn[aria-pressed="true"] { background: #dfe1e6; color: #172b4d; }
.hselect option { color: #172b4d; }
#project { max-width: 240px; }
.btn, .btn-primary, .btn-danger { white-space: nowrap; flex: none; }
.hsearch { width: 220px; background: rgba(255,255,255,0.2); }
.hsearch::placeholder { color: rgba(255,255,255,0.8); }
.hsearch:focus { background: #fff; color: #172b4d; outline: none; }
.seg { display: inline-flex; border-radius: 4px; overflow: hidden; }
.seg button { height: 32px; padding: 0 10px; background: rgba(255,255,255,0.2); color: #fff; }
.seg button + button { border-left: 1px solid rgba(255,255,255,0.15); }
.seg button[aria-pressed="true"] { background: #dfe1e6; color: #172b4d; font-weight: 600; }
.stat { font-size: 12px; opacity: 0.9; white-space: nowrap; }
.errbar { background: var(--warn-bg); color: var(--warn-fg); padding: 6px 12px; font-size: 13px; }

/* ---------- board ---------- */
.board {
  flex: 1; display: flex; align-items: flex-start; gap: 12px;
  padding: 12px; overflow-x: auto; overflow-y: hidden;
}
.list {
  flex: 0 0 272px; width: 272px; min-width: 0; max-height: 100%; display: flex; flex-direction: column;
  background: var(--list-bg); border-radius: 12px; box-shadow: var(--card-shadow);
}
.list.dragging-list { opacity: 0.4; }
.list-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px 12px; cursor: grab; }
.list-head .stripe { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.list-title {
  flex: 1; font-weight: 600; padding: 4px 6px; border-radius: 4px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.list-title-input { flex: 1; font-weight: 600; padding: 3px 6px; border-radius: 4px; border: 2px solid var(--focus); background: var(--input-bg); min-width: 0; }
.count { font-size: 12px; color: var(--list-muted); padding: 0 4px; white-space: nowrap; }
.count.over { color: #fff; background: var(--danger); border-radius: 10px; padding: 0 8px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--list-muted); }
.icon-btn:hover { background: var(--btn-subtle-hover); }
.default-tag { font-size: 11px; color: var(--list-muted); padding: 0 12px 4px; }
.cards { flex: 1; overflow-y: auto; padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.list.over-wip { box-shadow: inset 0 0 0 2px var(--danger); }
.more-btn { margin: 0 8px 8px; padding: 6px 8px; border-radius: 8px; text-align: left; color: var(--list-muted); }
.more-btn:hover { background: var(--btn-subtle-hover); }

.card {
  background: var(--card-bg); color: var(--card-fg); border-radius: 8px; box-shadow: var(--card-shadow);
  padding: 8px 10px; cursor: pointer; user-select: none; position: relative; touch-action: none;
}
.card:hover { background: var(--card-hover); }
.card.is-archived { opacity: 0.6; }
.card.drag-source { opacity: 0.25; }
.card .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { height: 8px; min-width: 40px; border-radius: 4px; }
.labels.expanded .chip { height: 16px; font-size: 12px; line-height: 16px; padding: 0 6px; color: #172b4d; font-weight: 600; min-width: 0; }
.card .title { word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; font-size: 12px; color: var(--card-muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; color: #fff; line-height: 16px; }
.badge.codex { background: var(--codex); }
.badge.claude { background: var(--claude); }
.pill { display: inline-flex; align-items: center; gap: 3px; border-radius: 3px; padding: 0 4px; }
.pill.prio-high { background: #ffd5d2; color: #ae2e24; }
.pill.prio-medium { background: #fff7d6; color: #7f5f01; }
.pill.prio-low { background: #dcfff1; color: #216e4e; }
.pill.due-over { background: var(--danger); color: #fff; }
.ellipsis { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placeholder { border-radius: 8px; background: var(--btn-subtle-hover); flex: none; }
.ghost {
  position: fixed; z-index: 1000; pointer-events: none; transform: rotate(3deg);
  box-shadow: 0 8px 16px -4px #091e4240, 0 0 1px #091e424f; opacity: 0.95;
}

.add-list { flex: 0 0 272px; }
.add-list-btn {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; color: #fff;
  background: rgba(255,255,255,0.24); font-weight: 500;
}
.add-list-btn:hover { background: rgba(255,255,255,0.32); }
.composer { background: var(--list-bg); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.text-input {
  width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--input-bg);
}
.text-input:focus { outline: none; border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
.row { display: flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
.btn-primary:hover { filter: brightness(1.08); }
.btn { background: var(--btn-subtle); padding: 6px 12px; border-radius: 4px; }
.btn:hover { background: var(--btn-subtle-hover); }
.btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; border-radius: 4px; }

/* ---------- popover ---------- */
.popover {
  position: fixed; z-index: 900; width: 304px; background: var(--modal-panel); color: var(--list-fg);
  border-radius: 8px; box-shadow: 0 8px 12px #091e4226, 0 0 1px #091e424f; padding: 12px;
}
.popover h3 { margin: 0 0 8px; font-size: 14px; text-align: center; color: var(--list-muted); font-weight: 600; }
.popover .close { position: absolute; right: 6px; top: 6px; }
.menu-item { display: block; width: 100%; text-align: left; padding: 6px 12px; border-radius: 4px; }
.menu-item:hover { background: var(--btn-subtle-hover); }
.menu-item.danger { color: var(--danger); }
.sep { height: 1px; background: var(--btn-subtle-hover); margin: 8px 0; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatch { height: 28px; border-radius: 4px; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--list-muted); margin: 8px 0 4px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 800; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 48px 16px; }
.modal { width: 840px; max-width: 100%; background: var(--modal-bg); color: var(--list-fg); border-radius: 12px; padding: 20px 24px 24px; position: relative; }
.modal .close { position: absolute; right: 12px; top: 12px; }
.modal h2 { margin: 0 40px 4px 0; font-size: 20px; line-height: 26px; word-break: break-word; }
.modal .sub { color: var(--list-muted); font-size: 13px; }
.modal-grid { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 24px; margin-top: 16px; }
.section-title { font-weight: 600; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--list-muted); }
.kv dd { margin: 0; word-break: break-all; }
textarea.note { width: 100%; min-height: 96px; resize: vertical; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--input-bg); }
.side-btn { display: flex; width: 100%; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; background: var(--btn-subtle); margin-bottom: 8px; text-align: left; }
.side-btn:hover { background: var(--btn-subtle-hover); }
.label-toggle { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px; border-radius: 4px; }
.label-toggle:hover { background: var(--btn-subtle-hover); }
.label-toggle .sw { flex: 1; height: 28px; border-radius: 4px; padding: 0 10px; line-height: 28px; color: #172b4d; font-weight: 600; text-align: left; }
.msg { background: var(--modal-panel); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--list-muted); margin-bottom: 2px; }
.msg.user { border-left: 3px solid var(--accent); }
.muted { color: var(--list-muted); font-size: 12px; }
.readonly-note { font-size: 12px; color: var(--list-muted); margin-top: 4px; }

.card-resume {
  position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 6px; display: none;
  place-items: center; font-size: 11px; background: var(--card-bg); color: var(--card-muted); box-shadow: var(--card-shadow);
}
.card:hover .card-resume, .card:focus-within .card-resume, .card:focus .card-resume { display: grid; }
.card-resume:hover { background: var(--accent); color: #fff; }
.host-chip { display: inline-flex; align-items: center; border-radius: 3px; padding: 0 4px; background: var(--btn-subtle-hover); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.resume-main { width: 100%; padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; line-height: 18px; }
.resume-main small { opacity: 0.85; font-size: 11px; font-weight: 400; }
.seg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg-btn { white-space: nowrap; padding: 5px 6px; border-radius: 4px; background: var(--btn-subtle); font-size: 12px; }
.seg-btn:hover:not(:disabled) { background: var(--btn-subtle-hover); }
.seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.host-row { display: flex; align-items: center; gap: 8px; }
.host-row .menu-item { flex: 1; min-width: 0; }
.menu-item.active { background: var(--btn-subtle-hover); box-shadow: inset 3px 0 0 var(--accent); }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }
.s-running { background: var(--c-blue); box-shadow: 0 0 0 0 var(--c-blue); animation: pulse 1.6s infinite; }
.s-waiting { background: var(--c-orange); }
.s-completed { background: var(--c-green); }
.s-aborted { background: var(--c-red); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(87,157,255,.6); } 70% { box-shadow: 0 0 0 6px rgba(87,157,255,0); } 100% { box-shadow: 0 0 0 0 rgba(87,157,255,0); } }
@media (prefers-reduced-motion: reduce) { .s-running { animation: none; } }
.card.unread { box-shadow: inset 3px 0 0 var(--accent), var(--card-shadow); }
.new-pill { background: var(--accent); color: #fff; font-weight: 600; }
.status-bar { display: inline-flex; gap: 4px; }
.status-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border-radius: 14px; background: rgba(255,255,255,0.2); color: #fff; font-size: 12px; }
.status-chip[aria-pressed="true"] { background: #fff; color: #172b4d; }
.rule-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
.toast-btn { margin-left: 8px; color: #fff; text-decoration: underline; font-weight: 600; }
.card.task { border-top: 3px solid var(--c-purple); }
.task-badge { background: var(--c-purple); }
.task-links { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.task-link { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--card-muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.task-link .host-chip { flex: none; max-width: 90px; }
.ellipsis.grow { max-width: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
.add-card { padding: 0 8px 8px; }
.add-card-btn { width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; color: var(--list-muted); }
.add-card-btn:hover { background: var(--btn-subtle-hover); }
.card-composer { padding: 0; background: none; }
.title-input { width: calc(100% - 40px); font-size: 20px; font-weight: 700; border: 0; background: transparent; color: inherit; padding: 2px 4px; border-radius: 4px; }
.title-input:focus { background: var(--input-bg); outline: 2px solid var(--focus); }
.start-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px; margin-bottom: 6px; }
.start-grid input { grid-column: 1 / -1; }
.sub-row { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; background: var(--modal-panel); margin-bottom: 4px; font-size: 13px; }
.link-btn { color: var(--accent); text-align: left; }
.link-btn:hover { text-decoration: underline; }
.danger-text { color: var(--danger); }
.pr-pill { display: inline-flex; align-items: center; gap: 2px; color: #fff; font-weight: 600; }
.pr-open { background: #1f883d; }
.pr-draft { background: #6e7781; }
.pr-merged { background: #8250df; }
.pr-closed { background: #cf222e; }
.ck { font-weight: 700; }
.pr-pill .ck-failing { color: #ffd7d5; }
.check-row { font-size: 12px; }
.check-row .ck-passing { color: var(--c-green); }
.check-row .ck-failing { color: var(--danger); }
.check-row .ck-pending { color: var(--c-orange); }
.ft-toggle { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-size: 12px; margin-left: -4px; }
.snippet { margin-top: 6px; font-size: 12px; color: var(--card-muted); line-height: 17px; word-break: break-word; }
.snippet mark { background: #ffe58f; color: #172b4d; border-radius: 2px; padding: 0 1px; }
.kbd { display: inline-block; min-width: 16px; font-size: 11px; color: var(--list-muted); border: 1px solid var(--btn-subtle-hover); border-radius: 3px; text-align: center; }
.board.with-lanes { flex-direction: column; align-items: stretch; overflow: auto; }
.lane { flex: none; }
.lane-head { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; padding: 4px 6px; border-radius: 6px; }
.lane-head:hover { background: rgba(255,255,255,0.14); }
.lane-head .count { color: rgba(255,255,255,0.85); }
.lane-lists { display: flex; align-items: flex-start; gap: 12px; padding: 4px 0 8px; }
.lane .list { max-height: none; }
.lane .cards { overflow: visible; }
.board.analytics-mode { display: block; overflow-y: auto; }
.analytics { padding: 4px 8px 24px; position: relative; color: var(--list-fg); }
.analytics h2 { color: #fff; margin: 0; font-size: 18px; }
.analytics-bar { margin-bottom: 12px; flex-wrap: wrap; }
.analytics-bar .muted { color: rgba(255,255,255,0.85); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
.tile, .panel { background: var(--list-bg); border-radius: 12px; padding: 12px 16px; box-shadow: var(--card-shadow); }
.tile-label { font-size: 12px; color: var(--list-muted); }
.tile-value { font-size: 26px; font-weight: 700; line-height: 34px; }
.tile-sub { font-size: 12px; color: var(--list-muted); }
.panel { margin-bottom: 12px; overflow-x: auto; }
.panel h3 { margin: 0 0 8px; font-size: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
.panel-grid .panel { margin-bottom: 0; }
.panel-grid + .panel-grid { margin-top: 12px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--list-muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
svg .grid { stroke: var(--btn-subtle-hover); stroke-width: 1; }
svg .axis { fill: var(--list-muted); font-size: 11px; }
.viz-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--modal-panel); color: var(--list-fg); border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px #0003; }
.viz-tip .tip-head { font-weight: 700; }
.hbars { display: flex; flex-direction: column; gap: 6px; }
.hbar-row { display: grid; grid-template-columns: 140px 1fr 120px; align-items: center; gap: 8px; font-size: 12px; }
.hbar { display: flex; gap: 2px; height: 12px; }
.hbar span { height: 100%; border-radius: 0; }
.hbar span:last-child { border-radius: 0 4px 4px 0; }
.hbar-val { color: var(--list-muted); text-align: right; white-space: nowrap; }
table.plain, .viz-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.plain th, table.plain td, .viz-table th, .viz-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--btn-subtle-hover); }
table.plain .stripe { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.viz-table { margin-top: 8px; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #172b4d; color: #fff; padding: 8px 16px; border-radius: 6px; z-index: 1100; box-shadow: 0 4px 8px #0004; }
.toast.error { background: var(--danger); }
.loading { color: #fff; padding: 24px; }
@media (max-width: 720px) {
  .hsearch { width: 140px; }
  .modal-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="topbar">
  <h1>Canban</h1>
  <input id="q" class="hsearch" type="search" placeholder="検索（タイトル・依頼・メモ）" aria-label="検索" />
  <label class="ft-toggle" title="会話の本文も検索する（3 文字以上）"><input id="fulltext" type="checkbox" /> 本文</label>
  <div class="seg" role="group" aria-label="エージェント">
    <button data-agent="all" aria-pressed="true">すべて</button>
    <button data-agent="codex" aria-pressed="false">Codex</button>
    <button data-agent="claude" aria-pressed="false">Claude</button>
  </div>
  <select id="project" class="hselect" aria-label="プロジェクト"><option value="">すべてのプロジェクト</option></select>
  <select id="days" class="hselect" aria-label="期間">
    <option value="7">7日以内</option>
    <option value="30" selected>30日以内</option>
    <option value="90">90日以内</option>
    <option value="0">全期間</option>
  </select>
  <button id="optBtn" class="hbtn" aria-haspopup="true">表示 ▾</button>
  <button id="rulesBtn" class="hbtn" title="自動移動ルール">⚡ ルール</button>
  <button id="viewsBtn" class="hbtn" aria-haspopup="true" title="保存したビュー（1〜9 キーで切り替え）">ビュー ▾</button>
  <button id="analyticsBtn" class="hbtn" aria-pressed="false" title="ボード / 分析 の切り替え">📊 分析</button>
  <button id="labelsBtn" class="hbtn">ラベル</button>
  <button id="hostsBtn" class="hbtn" aria-haspopup="true">マシン ▾</button>
  <button id="settingsBtn" class="hbtn" title="再開の設定" aria-label="再開の設定">⚙ 再開</button>
  <span class="spacer"></span>
  <span id="statusBar" class="status-bar" role="group" aria-label="実行状態"></span>
  <button id="seenBtn" class="hbtn" title="新着をすべて既読にする" hidden>✓ 既読</button>
  <span id="stat" class="stat"></span>
  <button id="refresh" class="hbtn" title="再読み込み" aria-label="再読み込み">⟳</button>
</header>
<div id="errbar" class="errbar" hidden></div>
<main id="board" class="board" aria-label="カンバンボード"><div class="loading">読み込み中…</div></main>

<script>
(() => {
'use strict';

// ======================================================================
// Host bridge: MCP Apps (postMessage JSON-RPC) with window.openai fallback
// ======================================================================
const bridge = (() => {
  let nextId = 1;
  const waiting = new Map();
  const listeners = {};
  const on = (m, fn) => ((listeners[m] ||= []).push(fn));
  const emit = (m, p) => (listeners[m] || []).forEach((fn) => { try { fn(p); } catch (e) { console.error(e); } });

  function post(msg) { window.parent.postMessage(msg, '*'); }
  function request(method, params, timeout = 60000) {
    const id = nextId++;
    post({ jsonrpc: '2.0', id, method, params });
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { waiting.delete(id); reject(new Error(`${method} がタイムアウトしました`)); }, timeout);
      waiting.set(id, { resolve: (v) => { clearTimeout(t); resolve(v); }, reject: (e) => { clearTimeout(t); reject(e); } });
    });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method, params }); }

  window.addEventListener('message', (ev) => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && (m.result !== undefined || m.error !== undefined) && waiting.has(m.id)) {
      const w = waiting.get(m.id); waiting.delete(m.id);
      m.error ? w.reject(new Error(m.error.message || 'Host error')) : w.resolve(m.result);
      return;
    }
    if (m.method) {
      emit(m.method, m.params);
      if (m.id != null) post({ jsonrpc: '2.0', id: m.id, result: {} }); // ack host requests (e.g. teardown)
    }
  });

  const openai = () => window.openai && typeof window.openai.callTool === 'function' ? window.openai : null;

  async function init() {
    if (openai()) {
      return { theme: window.openai.theme, displayMode: window.openai.displayMode };
    }
    try {
      const res = await request('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: { name: 'canban', version: '__CANBAN_VERSION__' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
      }, 8000);
      notify('ui/notifications/initialized', {});
      return res?.hostContext || {};
    } catch (e) {
      console.warn('ui/initialize failed', e);
      return {};
    }
  }

  async function callTool(name, args = {}) {
    let res;
    if (openai()) res = await window.openai.callTool(name, args);
    else res = await request('tools/call', { name, arguments: args });
    if (res?.isError) {
      const text = (res.content || []).map((c) => c.text).filter(Boolean).join('\n');
      throw new Error(text || `${name} failed`);
    }
    return res?.structuredContent ?? res;
  }

  function openLink(url) {
    if (openai() && window.openai.openExternal) return window.openai.openExternal({ href: url });
    return request('ui/open-link', { url }, 5000);
  }
  function requestFullscreen() {
    if (openai() && window.openai.requestDisplayMode) return window.openai.requestDisplayMode({ mode: 'fullscreen' }).catch(() => {});
    return request('ui/request-display-mode', { mode: 'fullscreen' }, 3000).catch(() => {});
  }
  function reportSize() {
    notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth, height: Math.max(560, window.innerHeight) });
  }
  return { init, callTool, on, openLink, requestFullscreen, reportSize };
})();

// ======================================================================
// State
// ======================================================================
const PAGE = 40;
const COLORS = ['gray', 'blue', 'green', 'yellow', 'orange', 'red', 'purple', 'pink', 'sky', 'lime'];
const COLOR_NAMES = { gray: 'グレー', blue: '青', green: '緑', yellow: '黄', orange: 'オレンジ', red: '赤', purple: '紫', pink: 'ピンク', sky: '水色', lime: 'ライム' };
const store = {
  get(k, d) { try { const v = localStorage.getItem(`sk:${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`sk:${k}`, JSON.stringify(v)); } catch {} },
};
const state = {
  board: null,
  filters: Object.assign({ agent: 'all', host: '', status: '', project: '', q: '', days: 30, includeArchived: false, includeSubagents: false, includeHidden: false, groupBranch: false, fulltext: false, swimlane: '' }, store.get('filters', {})),
  view: store.get('view', 'board'),
  shown: {},              // listId -> number of cards rendered
  labelsExpanded: store.get('labelsExpanded', false),
  drag: null,
  busy: false,
};

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const colorVar = (c) => (c ? `var(--c-${c})` : 'transparent');

function relTime(ms) {
  if (!ms) return '';
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return 'たった今';
  if (d < 3600) return `${Math.floor(d / 60)}分前`;
  if (d < 86400) return `${Math.floor(d / 3600)}時間前`;
  if (d < 86400 * 30) return `${Math.floor(d / 86400)}日前`;
  return new Date(ms).toLocaleDateString('ja-JP');
}
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString('ja-JP') : '-');

let toastTimer;
function toast(msg, isError = false) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: `toast${isError ? ' error' : ''}`, role: 'status', text: msg });
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isError ? 5000 : 2200);
}

async function act(name, args, { reload = true, okMsg } = {}) {
  try {
    const res = await bridge.callTool(name, args);
    if (okMsg) toast(okMsg);
    if (reload) await load();
    return res;
  } catch (e) {
    toast(e.message, true);
    await load();
    throw e;
  }
}

// ======================================================================
// Loading
// ======================================================================
let loadSeq = 0;
async function load({ refresh = false } = {}) {
  if (state.view === 'analytics') return loadAnalytics();
  const seq = ++loadSeq;
  const f = state.filters;
  const args = { agent: f.agent, q: f.q, days: Number(f.days), includeArchived: f.includeArchived, includeSubagents: f.includeSubagents, includeHidden: f.includeHidden, groupBranch: !!f.groupBranch, fulltext: !!f.fulltext, refresh };
  if (f.project) args.project = f.project;
  if (f.host) args.host = f.host;
  if (f.status) args.status = f.status;
  try {
    const board = await bridge.callTool('canban_get_board', args);
    if (seq !== loadSeq) return;
    state.board = board;
    render();
  } catch (e) {
    if (seq !== loadSeq) return;
    $('#board').replaceChildren(h('div', { class: 'loading', text: `読み込みに失敗しました: ${e.message}` }));
  }
}

function saveFilters() { store.set('filters', state.filters); }

// ======================================================================
// Rendering
// ======================================================================
function render() {
  const b = state.board;
  if (!b || state.view === 'analytics') return;
  if (state.drag) return; // don't disturb an active drag

  // header
  document.querySelectorAll('.seg button').forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.agent === state.filters.agent)));
  const sel = $('#project');
  const cur = state.filters.project;
  sel.replaceChildren(h('option', { value: '', text: 'すべてのプロジェクト' }),
    ...b.projects.map((p) => h('option', { value: p.name, text: `${p.name} (${p.count})` })));
  if (cur && !b.projects.some((p) => p.name === cur)) sel.append(h('option', { value: cur, text: cur }));
  sel.value = cur || '';
  $('#days').value = String(state.filters.days);
  const activeHost = b.hosts.find((x) => (x.local ? 'local' : x.id) === state.filters.host);
  const remoteOn = b.hosts.filter((x) => !x.local && x.enabled).length;
  $('#hostsBtn').textContent = `${activeHost ? activeHost.label : 'マシン'}${remoteOn ? `（+${remoteOn}）` : ''} ▾`;
  $('#hostsBtn').setAttribute('aria-pressed', String(!!activeHost));
  $('#stat').textContent = `表示 ${b.totals.shown} / Codex ${b.totals.codex}・Claude ${b.totals.claude}`;
  renderStatusBar(b);
  $('#seenBtn').hidden = !b.lists.some((l) => l.cards.some((c) => c.unread));
  announceAutoMoves(b);
  const eb = $('#errbar');
  eb.hidden = !b.errors.length;
  eb.textContent = b.errors.join(' / ');

  const boardEl = $('#board');
  const scroll = boardEl.scrollLeft;
  const listScroll = {};
  const scrollTop = boardEl.scrollTop;
  boardEl.querySelectorAll('.list').forEach((l) => (listScroll[l.dataset.listId] = $('.cards', l)?.scrollTop || 0));

  const focused = document.activeElement;
  const frag = document.createDocumentFragment();
  boardEl.classList.remove('analytics-mode');
  boardEl.classList.toggle('with-lanes', !!state.filters.swimlane);
  if (state.filters.swimlane) for (const lane of buildLanes(b, state.filters.swimlane)) frag.append(renderLane(lane));
  else {
    for (const list of b.lists) frag.append(renderList(list));
    frag.append(renderAddList());
  }
  boardEl.replaceChildren(frag);
  if (focused && focused !== document.body && boardEl.contains(focused)) focused.focus({ preventScroll: true });
  boardEl.scrollLeft = scroll;
  boardEl.scrollTop = scrollTop;
  boardEl.querySelectorAll('.list').forEach((l) => { const c = $('.cards', l); if (c) c.scrollTop = listScroll[l.dataset.listId] || 0; });
  bridge.reportSize();
}

function renderList(list, { inLane = false } = {}) {
  const over = list.wipLimit && list.count > list.wipLimit;
  const el = h('section', { class: `list${over ? ' over-wip' : ''}`, 'data-list-id': list.id, 'aria-label': list.title });
  const head = h('div', { class: 'list-head' },
    h('span', { class: 'stripe', style: { background: colorVar(list.color) } }),
    h('div', { class: 'list-title', tabindex: 0, title: 'クリックして名前を変更', text: list.title,
      onclick: (e) => editListTitle(e.currentTarget, list),
      onkeydown: (e) => { if (e.key === 'Enter') editListTitle(e.currentTarget, list); } }),
    h('span', { class: `count${over ? ' over' : ''}`, text: list.wipLimit ? `${list.count} / ${list.wipLimit}` : String(list.count) }),
    h('button', { class: 'icon-btn', 'aria-label': `${list.title} のメニュー`, text: '⋯', onclick: (e) => listMenu(e.currentTarget, list) }),
  );
  head.addEventListener('pointerdown', (e) => startListDrag(e, list, el));
  el.append(head);
  if (list.isDefault && !inLane) el.append(h('div', { class: 'default-tag', text: '新しいセッションはここに入ります' }));

  const cardsEl = h('div', { class: 'cards', 'data-list-id': list.id });
  const n = state.shown[list.id] || PAGE;
  for (const card of list.cards.slice(0, n)) cardsEl.append(renderCard(card, list));
  el.append(cardsEl);
  if (list.cards.length > n) {
    el.append(h('button', { class: 'more-btn', text: `さらに表示（残り ${list.cards.length - n} 件）`,
      onclick: () => { state.shown[list.id] = n + PAGE * 2; render(); } }));
  }
  if (!inLane) el.append(renderAddCard(list));
  return el;
}

// Trello-style "+ Add a card" at the bottom of every list (creates a task card).
// An open composer survives re-renders (same element), so typing isn't interrupted.
function renderAddCard(list) {
  if (state.addCard?.listId === list.id) return state.addCard.wrap;
  const wrap = h('div', { class: 'add-card' });
  const open = () => {
    const input = h('textarea', { class: 'text-input', rows: 2, placeholder: 'タスクのタイトルを入力…（Enter で追加）', maxlength: 300 });
    const close = () => { state.addCard = null; render(); };
    const submit = async () => {
      const title = input.value.trim();
      if (!title) return input.focus();
      input.value = '';
      input.focus();
      await act('canban_create_task', { title, list: list.id }).catch(() => {});
      const c = $(`.list[data-list-id="${CSS.escape(list.id)}"] .cards`);
      if (c) c.scrollTop = c.scrollHeight;
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
      if (e.key === 'Escape') close();
    };
    wrap.replaceChildren(h('div', { class: 'composer card-composer' }, input,
      h('div', { class: 'row' }, h('button', { class: 'btn-primary', text: 'カードを追加', onclick: submit }),
        h('button', { class: 'icon-btn', 'aria-label': '閉じる', text: '✕', onclick: close }))));
    state.addCard = { listId: list.id, wrap, input };
    input.focus();
  };
  wrap.append(h('button', { class: 'add-card-btn', text: '＋ カードを追加', onclick: open }));
  return wrap;
}

function renderCard(card, list) {
  if (card.kind === 'task') return renderTaskCard(card, list);
  const el = h('article', {
    class: `card${card.archived ? ' is-archived' : ''}${card.unread ? ' unread' : ''}`, tabindex: 0, 'data-card-id': card.id,
    'aria-label': `${card.title}（${STATUS_LABELS[card.status]}${card.unread ? '・新着' : ''}）`,
  });
  const lbl = cardLabels(card);
  if (lbl) el.append(lbl);
  el.append(h('div', { class: 'title' },
    card.status !== 'idle' ? h('span', { class: `sdot s-${card.status}`, title: STATUS_LABELS[card.status] }) : null,
    card.title));
  const meta = h('div', { class: 'meta' },
    card.unread ? h('span', { class: 'pill new-pill', text: '新着' }) : null,
    card.autoMoved ? h('span', { class: 'pill', title: 'ルールで自動移動', text: '⚡' }) : null,
    h('span', { class: `badge ${card.agent}`, text: card.agent === 'codex' ? 'Codex' : 'Claude' }),
    card.host ? h('span', { class: 'host-chip', title: `SSH: ${card.host.alias}`, text: `⌂ ${card.host.label}` }) : null,
    card.project ? h('span', { class: 'ellipsis', title: card.cwd || '', text: `📁 ${card.project}` }) : null,
    card.branch ? h('span', { class: 'ellipsis', title: card.branch, text: `⎇ ${card.branch}` }) : null,
    h('span', { title: fmtDate(card.updatedAt), text: relTime(card.updatedAt) }),
  );
  if (card.priority) meta.append(h('span', { class: `pill prio-${card.priority}`, text: { high: '優先度 高', medium: '優先度 中', low: '優先度 低' }[card.priority] }));
  if (card.due) {
    const overdue = Date.parse(card.due) < Date.now() - 86400000;
    meta.append(h('span', { class: `pill${overdue ? ' due-over' : ''}`, text: `🕑 ${new Date(card.due).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })}` }));
  }
  if (card.note) meta.append(h('span', { title: 'メモあり', text: '≡' }));
  if (card.pr) meta.append(prPill(card.pr));
  else if (card.prUrl) meta.append(h('span', { title: card.prUrl, text: 'PR' }));
  if (card.grouped?.length) meta.append(h('span', { class: 'pill', title: card.grouped.map((g) => g.title).join('\n'), text: `＋${card.grouped.length} 同じブランチ` }));
  if (card.archived) meta.append(h('span', { text: 'アーカイブ済' }));
  if (card.subagent) meta.append(h('span', { text: 'サブエージェント' }));
  if (card.subagents) meta.append(h('span', { class: 'pill', title: 'このセッションが起動したサブエージェント', text: `🤖 ${card.subagents.total}${card.subagents.running ? `（動作中 ${card.subagents.running}）` : ''}` }));
  if (card.hidden) meta.append(h('span', { text: '非表示' }));
  el.append(meta);
  if (card.snippet) el.append(renderSnippet(card.snippet));

  return attachCardBehavior(el, card, list, (opts) => resume(card.id, opts));
}

// Shared by session and task cards: drag, click to open, ▶ resume, keyboard.
function attachCardBehavior(el, card, list, onResume) {
  el.addEventListener('pointerdown', (e) => startCardDrag(e, card, el));
  el.addEventListener('click', () => { if (!state.justDragged) openCard(card.id); });
  if (onResume) {
    el.append(h('button', { class: 'card-resume', title: `再開（${shortcutHelp()}）`, 'aria-label': `${card.title} を再開`, text: '▶',
      onpointerdown: (e) => e.stopPropagation(),
      onclick: (e) => { e.stopPropagation(); onResume(optsFromEvent(e)); } }));
  }
  el.addEventListener('keydown', (e) => {
    if (e.target !== el) return;
    if (e.key === 'Enter') openCard(card.id);
    const k = onResume && !e.metaKey && !e.ctrlKey && !e.altKey && CARD_KEYS[e.key.toLowerCase()];
    if (k) { e.preventDefault(); onResume(k); }
    if (ARROWS[e.key] && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      if (e.altKey) focusNeighbor(list.id, card.id, e.key);
      else moveByKey(card, list.id, e.key);
    }
  });
  return el;
}

function cardLabels(card) {
  const labelsById = new Map(state.board.labels.map((l) => [l.id, l]));
  const labels = card.labels.map((id) => labelsById.get(id)).filter(Boolean);
  if (!labels.length) return null;
  return h('div', { class: `labels${state.labelsExpanded ? ' expanded' : ''}`, title: 'クリックでラベル名を表示',
    onclick: (e) => { e.stopPropagation(); state.labelsExpanded = !state.labelsExpanded; store.set('labelsExpanded', state.labelsExpanded); render(); } },
    labels.map((l) => h('span', { class: 'chip', style: { background: colorVar(l.color) }, text: state.labelsExpanded ? l.name : '' })));
}

function planMeta(meta, card) {
  if (card.priority) meta.append(h('span', { class: `pill prio-${card.priority}`, text: { high: '優先度 高', medium: '優先度 中', low: '優先度 低' }[card.priority] }));
  if (card.due) {
    const overdue = Date.parse(card.due) < Date.now() - 86400000;
    meta.append(h('span', { class: `pill${overdue ? ' due-over' : ''}`, text: `🕑 ${new Date(card.due).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })}` }));
  }
  if (card.note) meta.append(h('span', { title: 'メモあり', text: '≡' }));
}

// A task card: user-made, with its linked sessions listed inside.
function renderTaskCard(card, list) {
  const el = h('article', {
    class: `card task${card.unread ? ' unread' : ''}`, tabindex: 0, 'data-card-id': card.id,
    'aria-label': `${card.title}（タスク・${STATUS_LABELS[card.status]}）`,
  });
  const lbl = cardLabels(card);
  if (lbl) el.append(lbl);
  el.append(h('div', { class: 'title' },
    card.status !== 'idle' ? h('span', { class: `sdot s-${card.status}`, title: STATUS_LABELS[card.status] }) : null, card.title));
  if (card.links.length) {
    const box = h('div', { class: 'task-links' });
    for (const l of card.links.slice(0, 3)) {
      box.append(h('div', { class: 'task-link', title: l.title },
        h('span', { class: `sdot s-${l.status}` }),
        h('span', { class: `badge ${l.agent}`, text: l.agent === 'codex' ? 'Codex' : 'Claude' }),
        l.host ? h('span', { class: 'host-chip', text: `⌂ ${l.host.label}` }) : null,
        h('span', { class: 'ellipsis grow', text: l.title })));
    }
    if (card.links.length > 3) box.append(h('div', { class: 'muted', text: `ほか ${card.links.length - 3} 件` }));
    el.append(box);
  }
  const meta = h('div', { class: 'meta' },
    h('span', { class: 'badge task-badge', text: 'タスク' }),
    card.unread ? h('span', { class: 'pill new-pill', text: '新着' }) : null,
    card.autoMoved ? h('span', { class: 'pill', title: 'ルールで自動移動', text: '⚡' }) : null,
    card.description ? h('span', { title: '説明あり', text: '📝' }) : null);
  planMeta(meta, card);
  if (card.pr) meta.append(prPill(card.pr));
  for (const p of card.pending) meta.append(h('span', { class: `pill${p.expired ? ' due-over' : ''}`, title: p.expired ? '開始したセッションが見つかりません。詳細から手動で紐付けてください' : '開始したセッションを待っています',
    text: `${p.expired ? '⚠' : '⏳'} ${p.agent === 'codex' ? 'Codex' : 'Claude'}` }));
  el.append(meta);
  const latest = [...card.links].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
  return attachCardBehavior(el, card, list, latest ? (opts) => resume(latest.id, opts) : null);
}

function renderAddList() {
  const wrap = h('div', { class: 'add-list' });
  const btn = h('button', { class: 'add-list-btn', text: '＋ もう1つリストを追加' });
  btn.onclick = () => {
    const input = h('input', { class: 'text-input', placeholder: 'リスト名を入力…', maxlength: 80 });
    const submit = async () => {
      const title = input.value.trim();
      if (!title) return input.focus();
      input.disabled = true;
      await act('canban_create_list', { title }).catch(() => {});
      requestAnimationFrame(() => { const b = $('.add-list-btn'); b?.click(); $('#board').scrollLeft = 1e6; });
    };
    input.onkeydown = (e) => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') render(); };
    wrap.replaceChildren(h('div', { class: 'composer' }, input,
      h('div', { class: 'row' }, h('button', { class: 'btn-primary', text: 'リストを追加', onclick: submit }),
        h('button', { class: 'icon-btn', 'aria-label': '閉じる', text: '✕', onclick: () => render() }))));
    input.focus();
  };
  wrap.append(btn);
  return wrap;
}

function editListTitle(titleEl, list) {
  if (state.drag) return;
  const input = h('input', { class: 'list-title-input', value: list.title, maxlength: 80, 'aria-label': 'リスト名' });
  let done = false;
  const commit = async (save) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (save && v && v !== list.title) await act('canban_update_list', { listId: list.id, title: v }).catch(() => {});
    else render();
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') commit(true); if (e.key === 'Escape') commit(false); };
  input.onblur = () => commit(true);
  input.onpointerdown = (e) => e.stopPropagation();
  titleEl.replaceWith(input);
  input.select();
}

function closePopover() { document.querySelectorAll('.popover').forEach((p) => p.remove()); }
function popover(anchor, title, body, { width } = {}) {
  closePopover();
  const r = anchor.getBoundingClientRect();
  const p = h('div', { class: 'popover', role: 'dialog', 'aria-label': title, style: width ? { width: `${width}px` } : null },
    h('h3', { text: title }),
    h('button', { class: 'icon-btn close', 'aria-label': '閉じる', text: '✕', onclick: closePopover }),
    body);
  document.body.append(p);
  const left = Math.min(r.left, window.innerWidth - p.offsetWidth - 8);
  const top = Math.min(r.bottom + 6, window.innerHeight - p.offsetHeight - 8);
  p.style.left = `${Math.max(8, left)}px`;
  p.style.top = `${Math.max(8, top)}px`;
  setTimeout(() => {
    const off = (e) => { if (!p.contains(e.target)) { closePopover(); document.removeEventListener('pointerdown', off, true); } };
    document.addEventListener('pointerdown', off, true);
  });
  p.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });
  return p;
}

async function openCard(cardId) {
  if (cardId.startsWith('task:')) return openTaskModal(cardId);
  for (const l of state.board?.lists || []) for (const c of l.cards) if (c.id === cardId && c.unread) { c.unread = false; render(); }
  closePopover();
  closeModal();
  state.modalOpen = true;
  const overlay = h('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'セッション詳細' }, h('div', { class: 'muted', text: '読み込み中…' }));
  overlay.append(modal);
  overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  document.body.append(overlay);
  let d;

  } catch (e) {
    modal.replaceChildren(h('p', { text: `読み込みに失敗しました: ${e.message}` }));

const LANE_MODES = { '': 'なし', project: 'プロジェクト', host: 'マシン', agent: 'エージェント', label: 'ラベル' };
function laneKey(card, mode) {
  if (mode === 'agent') return card.kind === 'task' ? 'タスク' : card.agent === 'codex' ? 'Codex' : 'Claude Code';

  if (mode === 'label') {

    lanes.get(k).count++;

  return [...lanes.values()].sort((a, c) => c.count - a.count).map((lane) => ({
    ...lane,
    lists: b.lists.map((l) => {

// ======================================================================
// Drag & drop (pointer events; works inside sandboxed iframes)
// ======================================================================
function startCardDrag(e, card, el) {
  if (e.button !== 0 || e.target.closest('.labels')) return;
  const sx = e.clientX, sy = e.clientY;
  const rect = el.getBoundingClientRect();
  let started = false;
  const move = (ev) => {
    if (!started) {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
      started = true;
      const ghost = el.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = `${rect.width}px`;
      document.body.append(ghost);
      const ph = h('div', { class: 'placeholder', style: { height: `${rect.height}px` } });
      el.after(ph);
      el.classList.add('drag-source');
      el.style.display = 'none';
      state.drag = { type: 'card', card, el, ghost, ph, dx: sx - rect.left, dy: sy - rect.top, fromList: el.closest('.cards').dataset.listId };
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    ev.preventDefault();
    const d = state.drag;
    d.ghost.style.left = `${ev.clientX - d.dx}px`;
    d.ghost.style.top = `${ev.clientY - d.dy}px`;
    // Dropping a session card onto the middle of a task card links it to the task;
    // near a card's edges it is a normal move. Decide before moving the placeholder.
    let under = null;
    if (card.kind !== 'task') {
      d.ph.style.display = 'none';
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card.task');
      if (t) {
        const r = t.getBoundingClientRect();
        if (ev.clientY > r.top + r.height * 0.2 && ev.clientY < r.bottom - r.height * 0.2) under = t;
      }
    }
    if (d.dropTask !== under) {
      d.dropTask?.classList.remove('drop-target');
      d.dropTask = under;
      d.dropTask?.classList.add('drop-target');
    }
    d.ph.style.display = d.dropTask ? 'none' : '';
    if (!d.dropTask) placeCardPlaceholder(ev.clientX, ev.clientY);
    autoScroll(ev.clientX, ev.clientY);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    stopAutoScroll();
    if (!started) return;
    const d = state.drag;
    const cardsEl = d.ph.parentElement;
    const toList = cardsEl?.dataset.listId;
    // Index in the full list from the placeholder's neighbours (works with swimlanes too).
    let idx = -1;
    if (cardsEl) {
      const rest = state.board.lists.find((l) => l.id === toList).cards.filter((c) => c.id !== card.id);
      const near = (dir) => { let n = d.ph[dir]; while (n && (!n.classList.contains('card') || n.classList.contains('drag-source'))) n = n[dir]; return n; };
      const next = near('nextElementSibling');
      const prev = near('previousElementSibling');
      if (next) idx = rest.findIndex((c) => c.id === next.dataset.cardId);
      else if (prev) idx = rest.findIndex((c) => c.id === prev.dataset.cardId) + 1;
      else idx = rest.length;
      if (idx < 0) idx = rest.length;
    }
    d.ghost.remove();
    state.drag = null;
    state.justDragged = true;
    setTimeout(() => (state.justDragged = false), 0);
    if (d.dropTask) {
      const taskId = d.dropTask.dataset.cardId;
      d.dropTask.classList.remove('drop-target');
      act('canban_link_session', { taskId, sessionId: card.id }, { okMsg: 'タスクに紐付けました' }).catch(() => {});
      return;
    }
    if (toList && idx >= 0) moveCard(card, d.fromList, toList, idx);
    else render();
  };
  window.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function placeCardPlaceholder(x, y) {
  const d = state.drag;
  const listEl = listAt(x, y);
  if (!listEl) return;
  const cardsEl = $('.cards', listEl);
  const cards = [...cardsEl.querySelectorAll('.card:not(.drag-source)')];
  let before = null;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = c; break; }
  }
  if (before) { if (d.ph.nextSibling !== before) cardsEl.insertBefore(d.ph, before); }
  else if (cardsEl.lastElementChild !== d.ph) cardsEl.append(d.ph);
}

function listAt(x, y) {
  const cols = [...document.querySelectorAll('.list')].filter((l) => {
    const r = l.getBoundingClientRect();
    return x >= r.left - 6 && x <= r.right + 6;
  });
  if (cols.length <= 1) return cols[0] || null;
  // swimlanes: several columns share x — pick the one in the lane under the pointer
  return cols.find((l) => { const r = (l.closest('.lane') || l).getBoundingClientRect(); return y >= r.top && y <= r.bottom; }) || null;
}

// Compute an order value between neighbours in the target list (orders ascend top→bottom).
function orderAt(listId, index, excludeId) {
  const list = state.board.lists.find((l) => l.id === listId);
  const cards = list.cards.filter((c) => c.id !== excludeId);
  const prev = cards[index - 1], next = cards[index];
  if (prev && next) return (prev.order + next.order) / 2;
  if (prev) return prev.order + 1000;
  if (next) return next.order - 1000;
  return 0;
}

// Keyboard: arrows move the focused card (←→ between lists, ↑↓ within a list,
// Home/End to the top/bottom); ⌥ + arrows only move the focus.
const ARROWS = { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1, Home: 1, End: 1 };
function moveByKey(card, listId, key) {
  const lists = state.board.lists;
  const li = lists.findIndex((l) => l.id === listId);
  const ci = lists[li].cards.findIndex((c) => c.id === card.id);
  const others = lists[li].cards.length - 1;
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    const target = lists[li + (key === 'ArrowLeft' ? -1 : 1)];
    if (target) moveCard(card, listId, target.id, Math.min(ci, target.cards.length), true);
    return;
  }
  const index = key === 'ArrowUp' ? ci - 1 : key === 'ArrowDown' ? ci + 1 : key === 'Home' ? 0 : others;
  if (index < 0 || index > others || index === ci) return;
  moveCard(card, listId, listId, index, true);
}
function focusNeighbor(listId, cardId, key) {
  const lists = state.board.lists;
  const li = lists.findIndex((l) => l.id === listId);
  const ci = lists[li].cards.findIndex((c) => c.id === cardId);
  let tl = li, tc = ci;
  if (key === 'ArrowLeft' || key === 'ArrowRight') {
    const step = key === 'ArrowLeft' ? -1 : 1;
    for (tl = li + step; lists[tl] && !lists[tl].cards.length; tl += step);
    if (!lists[tl]) return;
    tc = Math.min(ci, lists[tl].cards.length - 1);
  } else if (key === 'ArrowUp' || key === 'Home') tc = key === 'Home' ? 0 : Math.max(0, ci - 1);
  else tc = key === 'End' ? lists[li].cards.length - 1 : Math.min(lists[li].cards.length - 1, ci + 1);
  const target = lists[tl].cards[tc];
  if (!target) return;
  ensureShown(lists[tl].id, tc);
  $(`.card[data-card-id="${CSS.escape(target.id)}"]`)?.focus();
}
function ensureShown(listId, index) {
  if (index < (state.shown[listId] || PAGE)) return;
  state.shown[listId] = index + PAGE;
  render();
}

function moveCard(card, fromListId, toListId, index, focusAfter = false) {
  const b = state.board;
  const order = orderAt(toListId, index, card.id);
  // optimistic update
  const from = b.lists.find((l) => l.id === fromListId);
  const to = b.lists.find((l) => l.id === toListId);
  from.cards = from.cards.filter((c) => c.id !== card.id);
  from.count = from.cards.length;
  const moved = { ...card, order, placed: true };
  to.cards.push(moved);
  to.cards.sort((a, c) => a.order - c.order);
  to.count = to.cards.length;
  const newIndex = to.cards.findIndex((c) => c.id === card.id);
  if (newIndex >= (state.shown[toListId] || PAGE)) state.shown[toListId] = newIndex + PAGE;
  render();
  if (focusAfter) $(`.card[data-card-id="${CSS.escape(card.id)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  if (focusAfter) $(`.card[data-card-id="${CSS.escape(card.id)}"]`)?.focus();
  bridge.callTool('canban_move_card', { cardId: card.id, toList: toListId, order })
    .catch((e) => { toast(`移動に失敗しました: ${e.message}`, true); load(); });
}

function startListDrag(e, list, listEl) {
  if (e.button !== 0 || e.target.closest('button, input, .list-title') || state.filters.swimlane) return;
  const sx = e.clientX;
  let started = false;
  const move = (ev) => {
    if (!started) {
      if (Math.abs(ev.clientX - sx) < 6) return;
      started = true;
      listEl.classList.add('dragging-list');
      state.drag = { type: 'list', list, listEl };
    }
    ev.preventDefault();
    const boardEl = $('#board');
    const others = [...boardEl.querySelectorAll('.list')].filter((l) => l !== listEl);
    let before = null;
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (ev.clientX < r.left + r.width / 2) { before = o; break; }
    }
    if (before) { if (listEl.nextSibling !== before) boardEl.insertBefore(listEl, before); }
    else boardEl.insertBefore(listEl, $('.add-list', boardEl));
    autoScroll(ev.clientX, ev.clientY);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    stopAutoScroll();
    if (!started) return;
    listEl.classList.remove('dragging-list');
    state.drag = null;
    const ids = [...document.querySelectorAll('#board .list')].map((l) => l.dataset.listId);
    const byId = new Map(state.board.lists.map((l) => [l.id, l]));
    state.board.lists = ids.map((id) => byId.get(id));
    render();
    bridge.callTool('canban_reorder_lists', { listIds: ids }).catch((err) => { toast(err.message, true); load(); });
  };
  window.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', up);
}

let scrollTimer = null, scrollVec = [0, 0, null];
function autoScroll(x, y) {
  const boardEl = $('#board');
  const br = boardEl.getBoundingClientRect();
  const edge = 60;
  let dx = 0;
  if (x < br.left + edge) dx = -18; else if (x > br.right - edge) dx = 18;
  let dy = 0, cardsEl = null;
  const listEl = state.drag?.type === 'card' ? listAt(x, y) : null;
  if (listEl) {
    cardsEl = $('.cards', listEl);
    const r = cardsEl.getBoundingClientRect();
    if (y < r.top + 40) dy = -14; else if (y > r.bottom - 40) dy = 14;
  }
  scrollVec = [dx, dy, cardsEl];
  if ((dx || dy) && !scrollTimer) {
    scrollTimer = setInterval(() => {
      const [sx, sy, c] = scrollVec;
      if (sx) boardEl.scrollLeft += sx;
      if (sy && c) c.scrollTop += sy;
    }, 16);
  } else if (!dx && !dy) stopAutoScroll();
}
function stopAutoScroll() { clearInterval(scrollTimer); scrollTimer = null; }

// ======================================================================
// Header wiring
// ======================================================================
let qTimer;
$('#q').value = state.filters.q || '';
$('#q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.filters.q = e.target.value; saveFilters(); state.shown = {}; load(); }, 250);
});
document.querySelectorAll('.seg button').forEach((btn) => btn.addEventListener('click', () => {
  state.filters.agent = btn.dataset.agent; saveFilters(); state.shown = {}; load();
}));
$('#project').addEventListener('change', (e) => { state.filters.project = e.target.value; saveFilters(); state.shown = {}; load(); });
$('#days').addEventListener('change', (e) => { state.filters.days = Number(e.target.value); saveFilters(); state.shown = {}; load(); });
$('#optBtn').addEventListener('click', (e) => optionsMenu(e.currentTarget));
$('#labelsBtn').addEventListener('click', (e) => labelsManager(e.currentTarget));
$('#hostsBtn').addEventListener('click', (e) => hostsMenu(e.currentTarget));
$('#rulesBtn').addEventListener('click', (e) => rulesMenu(e.currentTarget));
$('#viewsBtn').addEventListener('click', (e) => viewsMenu(e.currentTarget));
$('#fulltext').checked = !!state.filters.fulltext;
$('#fulltext').addEventListener('change', (e) => { state.filters.fulltext = e.target.checked; saveFilters(); if (state.filters.q) load(); });
function syncViewButton() {
  $('#analyticsBtn').setAttribute('aria-pressed', String(state.view === 'analytics'));
  $('#analyticsBtn').textContent = state.view === 'analytics' ? '▦ ボード' : '📊 分析';
}
syncViewButton();
$('#analyticsBtn').addEventListener('click', () => {
  state.view = state.view === 'analytics' ? 'board' : 'analytics';
  store.set('view', state.view);
  syncViewButton();
  if (state.view === 'board' && state.board) render();
  load();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.popover')) closePopover(); });
// 1–9: switch saved views (when not typing)
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.modalOpen || e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (!/^[1-9]$/.test(e.key) || e.target.classList?.contains('card')) return;
  const v = state.board?.settings?.views?.[Number(e.key) - 1];
  if (v) applyView(v);
});
$('#seenBtn').addEventListener('click', () => act('canban_mark_all_seen', {}, { okMsg: 'すべて既読にしました' }));
$('#settingsBtn').addEventListener('click', (e) => settingsMenu(e.currentTarget));
$('#refresh').addEventListener('click', () => load({ refresh: true }).then(() => toast('最新の状態に更新しました')));

// board: wheel over empty space scrolls horizontally like Trello
$('#board').addEventListener('wheel', (e) => {
  if (e.target.closest('.cards') || state.view === 'analytics' || state.filters.swimlane) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { $('#board').scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

// ======================================================================
// Theme & lifecycle
// ======================================================================
function applyTheme(t) {
  const theme = t === 'dark' || t === 'light' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
}
bridge.on('ui/notifications/host-context-changed', (p) => { if (p?.theme) applyTheme(p.theme); });
window.addEventListener('openai:set_globals', (e) => { const t = e.detail?.globals?.theme; if (t) applyTheme(t); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!state.hostTheme) applyTheme(); });

function idle() { return !state.drag && !state.modalOpen && !document.querySelector('.popover, .list-title-input, .composer'); }
let lastPoll = 0;
setInterval(() => {
  const every = state.board && hasLive(state.board) ? 15000 : 60000;
  if (Date.now() - lastPoll < every || document.visibilityState !== 'visible' || !idle()) return;
  lastPoll = Date.now();
  load();
}, 5000);
window.addEventListener('focus', () => { if (idle()) load(); });
window.addEventListener('resize', () => bridge.reportSize());

(async () => {
  const ctx = await bridge.init();
  state.hostTheme = ctx.theme;
  applyTheme(ctx.theme);
  if (ctx.displayMode === 'inline') {
    $('#refresh').after(h('button', { class: 'hbtn', title: '全画面で開く', 'aria-label': '全画面で開く', text: '⤢', onclick: () => bridge.requestFullscreen() }));
  }
  await load();
})();
})();
</script>
