<style>

*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button,input,textarea,select{border-radius:7px}button{border:1px solid var(--line);background:var(--panel);padding:7px 12px}button:hover:not(:disabled){background:var(--soft)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:23px;line-height:1.4;letter-spacing:-.02em}h2{font-size:16px}h3{font-size:13px}textarea,input{width:100%;border:1px solid var(--line);background:var(--panel);padding:10px 12px}textarea{resize:vertical;line-height:1.7}label{display:block}select{border:1px solid var(--line);background:var(--panel);padding:6px 9px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:#0c66e4;color:white;border-color:#0c66e4}.primary:hover:not(:disabled){background:#0955bd}.tag{font-size:11px;border-radius:5px;padding:2px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}.tag.task{color:var(--accent);background:var(--tint)}.tag.codex{color:var(--codex);background:color-mix(in srgb,var(--codex) 10%,var(--panel))}.tag.claude{color:var(--claude);background:color-mix(in srgb,var(--claude) 10%,var(--panel))}.dot{width:7px;height:7px;display:inline-block;flex:none;border-radius:50%;background:#3aaa87}.dot.waiting{background:#d99512}.rule{height:1px;background:var(--line);margin:18px 0}.preview-bar{min-height:48px;background:#0e2542;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px;font-size:12px}.preview-bar select,.preview-bar button{background:#1e3a5b;border-color:#46617f;color:#fff}.preview-controls{display:flex;align-items:center;gap:12px;flex-wra px;margin-top:10px}.session-button{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.session-button[aria-pressed=true]{background:var(--tint);border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.session-button .session-name{display:block;font-size:13px;font-weight:650;margin:7px 0 4px}.session-button .row{gap:7px}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-label .count{background:var(--soft);color:var(--muted);padding:0 7px;border-radius:10px;font-size:11px}.link-button{color:var(--accent);border:0;background:transparent;padding:4px 0;font-size:12px}.conversation-head{padding:18px 22px;border-bottom:1px solid var(--line)}.conversation-head h2{margin:7px 0 5px;font-size:17px}.conversation-head .session-caption{font-size:12px;color:var(--muted)}.conversation-content{padding:24px 22px;max-height:460px;min-height:280px;overflow:auto;display:flex;flex-direction:column;gap:22px;scrollbar-gutter:stable}.message{max-width:94%}.message.user{align-self:flex-end;background:var(--tint);padding:14px 16px;border-radius:12px 12px 3px 12px;max-width:84%}.message .author{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}.message .body{font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.message.agent .author{color:var(--codex)}.message.agent.claude .author{color:var(--claude)}.message.agent{padding-right:10px}.message-time{font-size:10px;color:var(--muted);margin-top:5px}.composer{padding:17px 22px;border-top:1px solid var(--line);background:var(--soft)}.composer-title{font-size:12px;font-weight:650;margin-bottom:9px}.composer textarea{min-height:83px;display:block;font-size:13px}.composer-actions{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.context-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}.check input{width:auto;accent-color:var(--accent)}.context-actions button{font-size:11px;padding:5px 8px}.send-target{font-size:11px;color:var(--muted);margin-bottom:7px}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:14px;padding:56px 24px;min-height:430px}.empty-symbol{width:56px;height:56px;border-radius:16px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-size:25px}.empty p{max-width:360px;color:var(--muted);font-size:13px}.new-session{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.layout-a{grid-template-columns:310px minmax(0,1fr)}.layout-b{grid-template-columns:minmax(0,1fr)}.summary-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 200px;gap:24px}.summary-grid .field{margin-bottom:0}.summary-grid .field textarea{min-height:90px}.summary-grid .note textarea{min-height:90px}.summary-info{padding-left:24px;border-left:1px solid var(--line)}.summary-info .properties{gap:6px;margin:10px 0}.session-tabs{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);overflow-x:auto}.session-tabs .session-button{width:auto;min-width:230px;padding:10px 12px}.session-tabs .session-name{margin:4px 0}.layout-b .conversation-content{max-height:350px;min-height:230px}.layout-c{grid-template-columns:270px minmax(0,1fr)}.parallel-head{margin-bottom:12px}.parallel{display:grid;grid-template-columns:repeat(var(--columns),minmax(250px,1fr));gap:14px;overflow-x:auto;padding:0 0 10px;align-items:start}.parallel .conversation-head{padding:16px}.parallel .conversation-head h2{font-size:14px}.parallel .conversation-content{padding:18px 16px;min-height:315px;max-height:385px}.parallel .message{max-width:100%}.parallel .message.user{max-width:95%;padding:10px 12px}.parallel .composer{padding:14px 16px}.parallel .composer-actions{align-items:flex-start}.parallel .context-actions{gap:5px}.parallel .composer-title{font-size:11px}.parallel .send-target{min-height:35px}.compare-note{font-size:12px;color:var(--muted);padding:12px 2px}.switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);background:#0e2542;border:1px solid #536780;color:#fff;border-radius:15px;box-shadow:0 8px 30px #091e4250;padding:12px 15px;width:min(700px,calc(100% - 24px))}.switcher-top{display:flex;align-items:center;gap:9px;justify-content:center}.switcher button{background:#1e3a5b;color:#dce8f8;border-color:#4c6180;padding:7px 10px;font-size:12px;white-space:nowrap}.switcher button[aria-pressed=true]{background:#fff;color:#123c73;border-color:#fff;font-weight:700}.switcher .arrow{font-size:16px;padding:4px 10px}.switcher-caption{font-size:11px;text-align:center;color:#bfcee0;margin-top:8px;line-height:1.5}.switcher-caption strong{color:#fff}.toast{position:fixed;right:24px;top:65px;background:#123c73;color:#fff;padding:11px 17px;border-radius:8px;box-shadow:var(--shadow);z-index:20;font-size:12px}.toast:empty{display:none}.board-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lane{background:color-mix(in srgb,var(--panel) 55%,var(--bg));padding:14px;border-radius:12px;min-height:380px;border:1px solid var(--line)}.lane h2{font-size:14px;margin-bottom:14px}.board-card{display:block;width:100%;padding:16px;text-align:left;margin-bottom:12px;box-shadow:0 1px 2px #091e4215}.board-card strong{display:block;margin:10px 0}.board-card .muted{font-size:12px}
@media(min-width:1500px){.layout-a{grid-template-columns:340px minmax(0,1fr)}.conversation-content{max-height:510px}}
@media(max-width:1100px){.app{grid-template-columns:64px minmax(0,1fr)}.brand{font-size:16px;padding:0 0 22px;text-align:center}.nav{padding-inline:7px}.nav-item{padding:11px;justify-content:center}.nav-item .nav-label,.nav-foot,.nav-divider{display:none}.work{padding-inline:18px}.toolbar{padding-inline:18px}.layout-a{grid-template-columns:290px minmax(0,1fr)}.summary-grid{grid-template-columns:1fr 1fr}.summary-info{grid-column:1/-1;border:0;padding:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.summary-info .properties{margin:0}.layout-c{grid-template-columns:240px minmax(0,1fr)}}
@media(max-width:760px){.preview-bar{align-items:flex-start;padding:10px 12px;flex-wrap:wrap}.preview-controls{gap:8px}.app{grid-template-columns:1fr}.nav{display:none}.toolbar{padding:12px}.toolbar .small{display:none}.work{padding:18px 12px 145px}.task-heading{margin-bottom:17px}h1{font-size:20px}.layout-a,.layout-c{grid-template-columns:1fr}.panel-body{padding:15px}.layout-a .panel-body{display:grid;grid-template-columns:1fr 1fr;gap:12px}.layout-a .panel-body>.properties,.layout-a .panel-body>.rule,.layout-a .panel-body>nav{grid-column:1/-1;margin:0}.layout-a .field{margin:0}.layout-a .session-list{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-grid{gap:14px}.summary-grid .field textarea{min-height:135px}.conversation-content{padding:20px 16px;max-height:410px}.conversation-head,.composer{padding:16px}.parallel{grid-template-columns:repeat(var(--columns),minmax(280px,1fr))}.layout-c .task-panel .panel-body{display:grid;grid-template-columns:1fr 1fr;gap:12px}.layout-c .task-panel .properties{grid-column:1/-1;margin:0}.layout-c .task-panel .field{margin:0}.switcher{bottom:10px;padding:10px}.switcher-top{gap:5px}.switcher button{padding:6px;font-size:10px}.switcher .arrow{padding:3px 7px}.switcher-caption{font-size:10px}.board-grid{grid-template-columns:1fr}.task-meta{gap:8px}.toast{right:12px;left:12px;top:110px}}
.preview-disclaimer{opacity:.72;margin-left:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.accent{color:var(--accent)}.layout-c>div{min-width:0}.conversation{container-type:inline-size}@container(max-width:370px){.composer-actions{flex-direction:column;align-items:stretch}.composer-actions>.primary{align-self:flex-end}.context-actions{align-items:flex-start}}

<body>
<header class="preview-bar">
  <div><span class="preview-label">レイアウト比較プレビュー</span> <span class="preview-disclaimer">架空データ · 操作はこの画面内のみ</span></div>
  <div class="preview-controls"><label>紐付け <select id="scenario"><option value="3">通常セッション 3件</option><option value="1">通常セッション 1件</option><option value="0">セッションなし</option></select></label><button id="theme">ダーク表示</button><button id="reset">リセット</button></div>
</header>
<div class="app">
  <aside class="nav" aria-label="Canbanのナビゲーション（表示例）"><div class="brand">Canban</div><div class="nav-item" id="nav-board"><span>▦</span><span class="nav-label">ボード</span></div><div class="nav-item active" id="nav-cards"><span>▣</span><span class="nav-label">開いているカード</span></div><div class="nav-item"><span>◷</span><span class="nav-label">分析</span></div><div class="nav-divider"></div><div class="nav-item"><span>⌁</span><span class="nav-label">カテゴリ</span></div><div class="nav-item"><span>◇</span><span class="nav-label">ラベル</span></div><div class="nav-item"><span>⚙</span><span class="nav-label">設定</span></div><div class="nav-foot">product-web<br>このマシン</div></aside>
  <div class="content"><header class="toolbar"><div><div class="crumb">product-web / 進行中</div><div class="toolbar-title" id="page-title">タスクと会話</div></div><div class="row"><span class="muted small">通常セッションをまとめる</span><button id="back-board">ボードに戻る</button></div></header><main id="main" class="work"></main></div>
</div>
<nav class="switcher" aria-label="プレビューのパターン選択"><div class="switcher-top"><button class="arrow" id="previous" aria-label="前のパターン">←</button><button data-variant="A">A · 左右分割</button><button data-variant="B">B · 上下分割</button><button data-variant="C">C · 会話を並列</button><button class="arrow" id="next" aria-label="次のパターン">→</button></div><p class="switcher-caption" id="caption" aria-live="polite"></p></nav>
<div id="toast" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const variants={A:{name:'左右分割',reason:'説明・メモを参照しながら、1つの会話を進める。',trade:'会話への集中と、仕事の情報を両立。'},B:{name:'上下分割',reason:'仕事の情報を上にまとめ、下の広い会話をタブで切り替える。',trade:'会話の横幅を確保。説明が長いと縦に伸びる。'},C:{name:'会話を並列',reason:'同じ仕事の通常セッションを並べて読み比べる。',trade:'同時に追いやすい。会話が増えると横スクロール。'}};
const initialSessions=[
 {id:'implementation',agent:'Codex',title:'入力フォームの実装',status:'completed',statusLabel:'完了',time:'3分前',branch:'fix/form-feedback',messages:[{role:'user',text:'お問い合わせフォームで、入力エラーの理由が分かるようにしてください。まず必須項目とメールアドレスの表示を改善したいです。',time:'14:10'},{role:'agent',text:'必須項目とメールアドレスのエラーを、該当する入力欄の下に表示しました。\n\n・送信後も入力内容を保持\n・最初のエラー項目へフォーカスを移動\n・修正するとエラー表示を更新\n\n確認用の画面を用意しました。エラー文の言い回しを確認してください。',time:'14:24'}]},
 {id:'review',agent:'Claude',title:'案内文と操作のレビュー',status:'waiting',statusLabel:'確認待ち',time:'8分前',branch:'fix/form-feedback',messages:[{role:'user',text:'お問い合わせフォームのエラー案内を見直してください。専門用語を使わず、次に何をすればよいか分かる文章にしたいです。',time:'13:40'},{role:'agent',text:'案内文を2つの方針で整理しました。\n\n1. 必須項目は「お名前を入力してください」のように具体的に案内\n2. メール形式は入力例を添えて案内\n\n「入力内容に誤りがあります」だけでは修正箇所が分からないため、欄ごとの表示をおすすめします。こちらの方針で進めてよいですか？',time:'14:19'}]},
 {id:'research',agent:'Codex',title:'既存フォームの調査',status:'completed',statusLabel:'完了',time:'42分前',branch:'main',messages:[{role:'user',text:'現在のお問い合わせフォームで、エラー時の表示と入力内容の保持がどう実装されているか調べてください。',time:'12:55'},{role:'agent',text:'調査結果をまとめました。\n\n現状は画面上部に共通メッセージが出ますが、入力欄ごとの案内はありません。送信に失敗した場合の入力内容は保持されています。\n\n改善箇所はフォームの表示と、エラー項目へのフォーカス移動です。',time:'13:45'}]}
];
let state;
function fresh(){return{variant:['A','B','C'].includes(new URL(location.href).searchParams.get('variant'))?new URL(location.href).searchParams.get('variant'):'A',count:3,selected:'implementation',description:'お問い合わせフォームの入力エラーを分かりやすくする。\n入力内容を保持し、直す場所がすぐ分かる状態にしたい。',note:'エラー文は短く、専門用語を避ける。\nスマートフォンでの見え方も確認する。',sessions:structuredClone(initialSessions),drafts:{},includeNote:true,board:false};}
state=fresh();
const visibleSessions=()=>state.sessions.slice(0,state.count);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('#toast').textContent=message;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').textContent='',3200);}
function sessionButton(s){return `<button class="session-button" data-session="${s.id}" aria-pressed="${state.selected===s.id}"><span class="row"><span class="tag ${s.agent.toLowerCase()}">${s.agent}</span><span class="small muted"><span class="dot ${s.status}"></span> ${s.statusLabel}</span></span><span class="session-name">${s.title}</span><span class="small muted">このマシン · ${s.time}</span></button>`;}
function properties(){return '<div class="properties"><span class="property">優先度 高</span><span class="property">期限 10月5日</span><span class="property">ラベル UX</span></div>';}
function fields(){return `<label class="field"><span>説明</span><textarea data-field="description" aria-label="タスクの説明">${esc(state.description)}</textarea></label><label class="field note"><span>メモ</span><textarea data-field="note" aria-label="タスクのメモ">${esc(state.note)}</textarea></label>`;}
function sessionList(){const ss=visibleSessions();return `<nav aria-label="紐付いた通常セッション"><div class="section-label"><h3>紐付いたセッション</h3><span class="count">${ss.length}</span></div><div class="session-list">${ss.map(sessionButton).join('')||'<p class="small muted">まだセッションがありません。</p>'}</div>${ss.length?'<button class="link-button" data-new="Codex">＋ 新しいセッションを開始</button>':''}</nav>`;}
function taskPanel(list=true){return `<section class="panel task-panel" aria-label="親タスクの情報"><div class="panel-head"><h2>タスクの情報</h2><span class="tag task">親カード</span></div><div class="panel-body">${properties()}${fields()}${list?'<div class="rule"></div>'+sessionList():''}</div></section>`;}
function newSessionButtons(){return '<div class="new-session"><button class="primary" data-new="Codex">Codexで開始</button><button data-new="Claude">Claudeで開始</button></div>';}
function empty(){return `<section class="panel"><div class="empty"><div class="empty-symbol">＋</div><h2>この仕事の会話を始める</h2><p>説明・メモをもとに依頼を作成できます。開始した通常セッションが、このタスクに紐付きます。</p>${newSessionButtons()}<span class="small muted">開始先：このマシン / product-web</span></div></section>`;}
function conversation(s){return `<section class="panel conversation" aria-label="${s.agent} ${s.title}の会話"><header class="conversation-head"><div class="row between"><div class="row"><span class="tag ${s.agent.toLowerCase()}">${s.agent}</span><span class="small muted"><span class="dot ${s.status}"></span> ${s.statusLabel}</span></div><span class="small muted">通常セッション</span></div><h2>${s.title}</h2><div class="session-caption">このマシン / product-web · ${s.branch}</div></header><div class="conversation-content" data-feed="${s.id}" tabindex="0" aria-label="会話の履歴">${s.messages.map(m=>`<article class="message ${m.role} ${s.agent.toLowerCase()}"><div class="author">${m.role==='user'?'あなた':s.agent}</div><div class="body">${esc(m.text)}</div><div class="message-time">${m.time}</div></article>`).join('')}</div><form class="composer" data-form="${s.id}"><div class="composer-title">この会話に追加で依頼</div><div class="send-target">送信先：${s.agent} / ${s.title}</div><textarea data-draft="${s.id}" aria-label="${s.title}への依頼文" placeholder="次に進めたいことを入力…">${esc(state.drafts[s.id]||'')}</textarea><div class="composer-actions"><div class="context-actions"><button type="button" data-context="${s.id}">説明・メモから作成</button><label class="check"><input type="checkbox" data-include-note ${state.includeNote?'checked':''}>メモを含める</label></div><button type="submit" class="primary">依頼を追加 ↑</button></div></form></section>`;}
function VariantA(){const s=visibleSessions().find(s=>s.id===state.selected);return `<div class="workspace layout-a">${taskPanel()}${s?conversation(s):empty()}</div>`;}
function VariantB(){const ss=visibleSessions();const s=ss.find(s=>s.id===state.selected);return `<div class="workspace layout-b"><section class="panel"><div class="panel-head"><h2>タスクの情報</h2><span class="tag task">親カード</span></div><div class="panel-body summary-grid">${fields()}<div class="summary-info"><span class="small muted">この仕事の設定</span>${properties()}<span class="small muted">通常セッション ${ss.length}件</span>${ss.length?'<button class="link-button" data-new="Codex">＋ 新しいセッションを開始</button>':''}</div></div></section>${s?`<div><nav class="session-tabs panel" aria-label="会話を切り替える">${ss.map(sessionButton).join('')}</nav><div class="mt12">${conversation(s)}</div></div>`:empty()}</div>`;}
function VariantC(){const ss=visibleSessions();return `<div class="workspace layout-c">${taskPanel(false)}<div>${ss.length?`<div class="parallel-head row between"><h2>紐付いた会話 <span class="small muted">${ss.length}件</span></h2><button class="link-button" data-new="Codex">＋ 新しいセッション</button></div><div class="parallel" style="--columns:${ss.length}">${ss.map(conversation).join('')}</div><p class="compare-note">それぞれの会話を独立して読み、送信先を選んで依頼できます。</p>`:empty()}</div></div>`;}
function heading(){return `<header class="task-heading"><div class="row"><span class="tag task">タスクカード</span><span class="tag">進行中</span><span class="small muted">product-web</span></div><h1>フォームの入力エラーを分かりやすくする</h1><div class="task-meta"><span>◉ 紐付いた通常セッション ${visibleSessions().length}件</span><span>サブエージェントは各セッション内で扱う</span></div></header>`;}
function board(){return `<header class="task-heading"><h1>product-web</h1><p class="muted small mt8">タスクカードを開くと、仕事の情報と紐付いた会話が表示されます。</p></header><div class="board-grid"><section class="lane"><h2>未着手 <span class="muted">2</span></h2><div class="board-card panel"><span class="tag task">タスクカード</span><strong>設定画面の項目を整理する</strong><span class="muted">セッションなし</span></div><div class="board-card panel"><strong>ヘルプページの更新</strong><span class="muted">Codex · 完了</span></div></section><section class="lane"><h2>進行中 <span class="muted">1</span></h2><button class="board-card" id="open-task"><span class="tag task">タスクカード</span><strong>フォームの入力エラーを分かりやすくする</strong><p class="muted">通常セッション ${visibleSessions().length}件</p><div class="row mt12"><span class="tag">UX</span><span class="tag">期限 10/5</span></div><div class="small mt16 accent">タスクと会話を開く →</div></button></section><section class="lane"><h2>完了 <span class="muted">1</span></h2><div class="board-card panel"><strong>トップページのリンク修正</strong><span class="muted">Claude · 完了</span></div></section></div>`;}
function render(){const ss=visibleSessions();if(!ss.some(s=>s.id===state.selected))state.selected=ss[0]?.id||null;$('#main').innerHTML=state.board?board():heading()+({A:VariantA,B:VariantB,C:VariantC}[state.variant]());$('#page-title').textContent=state.board?'ボード':'タスクと会話';$('#back-board').textContent=state.board?'タスクを開く':'ボードに戻る';$('#nav-board').classList.toggle('active',state.board);$('#nav-cards').classList.toggle('active',!state.board);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===state.variant));const v=variants[state.variant];$('#caption').innerHTML=`<strong>${state.variant} · ${v.name}</strong>　${v.reason}<br>${v.trade} · 通常セッション ${ss.length}件${state.variant!=='C'&&ss.length?' · 表示中：'+ss.find(s=>s.id===state.selected).title:''}`;wire();}
function wire(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>state[el.dataset.field]=el.value));document.querySelectorAll('[data-session]').forEach(el=>el.addEventListener('click',()=>{state.selected=el.dataset.session;render();document.querySelector(`[data-session="${state.selected}"]`)?.focus();}));document.querySelectorAll('[data-draft]').forEach(el=>el.addEventListener('input',()=>state.drafts[el.dataset.draft]=el.value));document.querySelectorAll('[data-include-note]').forEach(el=>el.addEventListener('change',()=>{state.includeNote=el.checked;document.querySelectorAll('[data-include-note]').forEach(x=>x.checked=el.checked);}));document.querySelectorAll('[data-context]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.context;state.drafts[id]=['フォームの入力エラーを分かりやすくする',state.description,state.includeNote&&state.note?'メモ：\n'+state.note:''].filter(Boolean).join('\n\n');const input=document.querySelector(`[data-draft="${id}"]`);input.value=state.drafts[id];input.focus();notify('説明'+(state.includeNote?'・メモ':'')+'を依頼文に取り込みました');}));document.querySelectorAll('[data-form]').forEach(el=>el.addEventListener('submit',e=>{e.preventDefault();const id=el.dataset.form;const text=(state.drafts[id]||'').trim();if(!text){document.querySelector(`[data-draft="${id}"]`).focus();notify('依頼文を入力してください');return;}const s=state.sessions.find(s=>s.id===id);s.messages.push({role:'user',text,time:'たった今'},{role:'agent',text:'依頼内容を確認しました。この方針で作業を進めます。',time:'たった今'});s.time='たった今';state.drafts[id]='';render();const feed=document.querySelector(`[data-feed="${id}"]`);feed.scrollTop=feed.scrollHeight;document.querySelector(`[data-draft="${id}"]`).focus();notify('プレビュー内で'+s.agent+'の会話に依頼を追加しました');}));document.querySelectorAll('[data-new]').forEach(el=>el.addEventListener('click',()=>startMock(el.dataset.new)));$('#open-task')?.addEventListener('click',()=>{state.board=false;render();});}
function startMock(agent){const id='new-'+Date.now();const s={id,agent,title:'追加の確認と改善',status:'completed',statusLabel:'完了',time:'たった今',branch:'fix/form-feedback',messages:[{role:'user',text:state.description+(state.includeNote&&state.note?'\n\nメモ：\n'+state.note:''),time:'たった今'},{role:'agent',text:'説明とメモを確認しました。まず現在の画面を確認し、改善箇所を整理します。',time:'たった今'}]};state.sessions=visibleSessions().concat(s);state.count=state.sessions.length;state.selected=id;updateScenario();render();notify('プレビュー内で'+agent+'の通常セッションを紐付けました');}
function updateScenario(){const select=$('#scenario');select.querySelector('[data-custom]')?.remove();if(![0,1,3].includes(state.count)){const option=document.createElement('option');option.value=state.count;option.dataset.custom='true';option.textContent='通常セッション '+state.count+'件';select.append(option);}select.value=state.count;}
function setVariant(v){state.variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render();}
function cycle(delta){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length]);}
document.querySelectorAll('[data-variant]').forEach(el=>el.addEventListener('click',()=>setVariant(el.dataset.variant)));$('#previous').addEventListener('click',()=>cycle(-1));$('#next').addEventListener('click',()=>cycle(1));$('#scenario').addEventListener('change',e=>{state.count=Number(e.target.value);state.sessions=structuredClone(initialSessions);state.selected=state.count?'implementation':null;state.drafts={};render();});$('#theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'ライト表示':'ダーク表示';});$('#reset').addEventListener('click',()=>{state=fresh();updateScenario();render();notify('説明・メモと会話を初期状態に戻しました');});$('#back-board').addEventListener('click',()=>{state.board=!state.board;render();});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable],.conversation-content'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});render();
</script>
</body>
</html>
