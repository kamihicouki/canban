<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 受信トレイ · Canban カード案</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="cards.css">
<style>
.wrap { position: absolute; inset: 0; display: flex; padding: 12px; gap: 12px; }
.side { width: 340px; flex: none; background: var(--list-bg); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; color: var(--list-fg); }
.side .top { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.srch { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--btn-subtle); color: var(--list-muted); font-size: 13px; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--btn-subtle); } .seg button { flex: 1; height: 26px; border-radius: 7px; font-size: 12px; white-space: nowrap; padding: 0 4px; color: var(--list-muted); } .seg button[aria-selected=true] { background: var(--card-bg); color: var(--card-fg); font-weight: 600; box-shadow: var(--card-shadow); }
.sc { flex: 1; overflow: auto; padding: 0 6px 10px; }
.gh { display: flex; align-items: center; gap: 6px; padding: 12px 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--list-muted); } .gh .n { font-weight: 400; }
.it { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 8px 8px; border-radius: 10px; color: var(--list-fg); position: relative; }
.it:hover { background: var(--btn-subtle); } .it[aria-selected=true] { background: var(--card-bg); box-shadow: var(--card-shadow); }
.it .g { margin-top: 2px; } .it .tt { font-size: 13.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it .sb { font-size: 12px; color: var(--list-muted); display: flex; gap: 8px; align-items: center; margin-top: 2px; white-space: nowrap; overflow: hidden; } .it .sb .grow { flex: 1; }
.it .tmx { font-size: 11.5px; color: var(--list-muted); flex: none; margin-top: 2px; }
.pane { flex: 1; border-radius: 12px; min-width: 0; position: relative; }
.hd { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--btn-subtle); flex: none; } .hd h2 { margin: 0; font-size: 16px; }
.scroll { flex: 1; overflow: auto; padding: 20px 24px 150px; } .col { max-width: 700px; margin: 0 auto; }
.dock { position: absolute; inset: auto 0 0 0; padding: 0 24px 14px; background: linear-gradient(transparent, var(--card-bg) 36%); } .dock > * { max-width: 700px; margin: 0 auto; }
.foots { position: absolute; left: 24px; bottom: 16px; }
</style></head>
<body>
<script src="shared.js"></script>
<script>
const stage = shell('08 受信トレイ', { backdrop: false });
const ITEMS = [
  ['wait', 'APIのレート制限を調査して、再試行ロジックを入れる', 'claude', 'fix/retry-429', '2分', 'ここ'],
  ['err', 'ビルドが落ちる原因の調査', 'codex', 'main', '3時間', 'ここ'],
  ['run', 'カレンダーをインフィニティスクロールに', 'codex', 'feat/calendar-infinite', '7分', 'run'],
  ['run', 'ダークテーマのコントラスト修正', 'codex', 'fix/dark-contrast', '12分', 'run'],
  ['run', 'Slack取り込みの重複除去', 'claude', 'feat/slack-dedupe', '20分', 'run'],
  ['done', '設定画面のキーボード操作', 'claude', 'feat/settings-keys', '1時間', 'done'],
  ['idle', 'リリース手順をREADMEへまとめる', 'claude', 'docs/release', '3日前', 'done'],
];
const GROUPS = [['要対応', ['ここ'], 'wait'], ['実行中', ['run'], 'run'], ['最近', ['done'], 'done']];
const who = { codex: 'Codex', claude: 'Claude' };
const glyph = (s) => `<span class="g ${s}">${s === 'done' ? ic('check', 12) : s === 'err' ? ic('alert', 11) : ''}</span>`;
let cur = 2;
function draw() {
  $('#list').innerHTML = GROUPS.map(([n, keys]) => { const its = ITEMS.map((x, i) => [x, i]).filter(([x]) => keys.includes(x[5])); return `<div class="gh">${n}<span class="n">${its.length}</span></div>` + its.map(([x, i]) => `<button class="it" aria-selected="${i === cur}" data-i="${i}">${glyph(x[0])}<span class="grow" style="min-width:0"><span class="tt">${x[1]}</span><span class="sb"><span class="who ${x[2]}">${who[x[2]]}</span><span class="mono" style="overflow:hidden;text-overflow:ellipsis">${x[3]}</span></span></span><span class="tmx">${x[4]}</span></button>`).join(''); }).join('');
  const c = ITEMS[cur];
  $('#ttl').textContent = c[1];
  $('#hs').innerHTML = `<span class="st st-${c[0] === 'idle' ? 'idle' : c[0]}"><i></i>${{ run: '実行中', wait: '入力待ち', err: 'エラー', done: '完了', idle: '待機' }[c[0]]}</span>`;
  $('#ag').className = 'ag ag-' + c[2]; $('#ag').textContent = who[c[2]];
  $('#br').innerHTML = `${ic('branch', 13)} ${c[3]}`;
  fillIc();
}
stage.insertAdjacentHTML('beforeend', `<div class="wrap"><aside class="side"><div class="top"><div class="srch">${ic('search', 15)}<span class="grow">セッションを検索</span>${kc('/')}</div><div class="seg"><button aria-selected="true">すべて</button><button aria-selected="false">自分の</button><button aria-selected="false">Slack</button><button aria-selected="false">アーカイブ</button></div></div><div class="sc" id="list"></div></aside>
<section class="pane"><div class="hd"><span id="ag" class="ag"></span><h2 id="ttl" class="grow"></h2><span id="hs"></span><span class="chipx mono" id="br"></span><button class="btn line">${ic('board', 14)} ボードで見る</button><button class="iconbtn">${ic('more', 17)}</button></div>
<div class="scroll"><div class="col"><div class="thread">${THREAD_HTML({ running: false })}</div></div></div>
<div class="dock">${composer({ running: false, id: 'c8' })}<div class="hint" style="padding:8px 6px 0">${kc('j')} ${kc('k')} 前後 ${kc('e')} 完了にして次へ ${kc('r')} 返信 ${kc('b')} ボードで見る</div></div></section></div>`);
$('#list').onclick = (e) => { const b = e.target.closest('.it'); if (b) { cur = +b.dataset.i; draw(); } };
addEventListener('keydown', (e) => { if (/TEXTAREA|INPUT/.test(e.target.tagName)) { return; } const order = ITEMS.map((x, i) => [x, i]).sort((a, b) => GROUPS.findIndex((g) => g[1].includes(a[0][5])) - GROUPS.findIndex((g) => g[1].includes(b[0][5]))).map((p) => p[1]); const p = order.indexOf(cur); if (e.key === 'j') { cur = order[Math.min(order.length - 1, p + 1)]; draw(); } if (e.key === 'k') { cur = order[Math.max(0, p - 1)]; draw(); } if (e.key === 'r') { e.preventDefault(); $('textarea').focus(); } });
draw(); wireComposer($('.cmp')); const sc = $('.scroll'); sc.scrollTop = sc.scrollHeight;
</script></body></html>
